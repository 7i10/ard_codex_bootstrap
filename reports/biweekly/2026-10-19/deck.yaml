- section: 3. Phase 1
  type: table
  title: Phase 1：結果と考察
  script: 'Phase 1 の結果です。最良の学習率での PGD-10 は、30.7%から39.4%でした。

    まず、大きいモデルほど頑健で、9.7M の MobileNetV4-M が39.4%と最も高くなりました。ConvNeXt-Atto は3.7M と小さいのに37.0%と高く見えますが、計算量は MobileNetV4-S の約3倍あります。計算量の順に並べると、MobileNetV4-S、EfficientNet-B0、ConvNeXt-Atto、MobileNetV4-M の順で、頑健性も同じ順に並びます。つまり、パラメータ数より計算量のほうが頑健性とよく対応しています。例外は DeiT で、計算量が最も大きいのに35.0%です。

    また、計算量と学習速度は別物で、DeiT は計算量が最も大きいのに学習は比較的速く、EfficientNet-B0 は計算量の割に遅いという違いがありました。

    学習率によって最大2.4ポイント変わること、DeiT だけ乱数の種による揺れが1.37ポイントと大きいことも分かりました。'
  point: 大きいほど頑健。計算量（GMACs）の順にもほぼ並ぶ（DeiT を除く）
