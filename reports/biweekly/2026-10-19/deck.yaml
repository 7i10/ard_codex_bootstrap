    caption: GMACs＝推論1枚の計算量（デプロイ時の重さ）。学習速度＝学習の重さ（RTX 4090 1枚で測定、DeiT は参考値）。揺れ＝seed を変えたときの PGD-10 の差
  side_w: 4.4
  side:
  - '**大きいほど頑健**

    M（9.7M）39.4 ＞ S（3.8M）30.7'
  - '**ConvNeXt-Atto は計算量では順当**

    パラメータは S と同じでも

    計算量は約3倍（0.55 GMACs）

    計算量の順 S < B0 < Atto < M と

    頑健性の順が一致'
  - '**計算量と学習速度は別物**

    DeiT：計算量最大でも速い

    EfficientNet-B0：計算量の割に遅い'
  - 学習率で最大 2.4pt 変わる
  - 'DeiT だけ seed の揺れが大きい

    （原因は未確認）'
  notes: 'ConvNeXt-Atto が高い理由の仮説：(1) 計算量が多い（解像度の高い段で 7×7 の畳み込みを使う）。(2) 活性化関数が滑らかな GELU。ただし MobileNetV4-S を SiLU にしても 33.27 で Atto の 37.02 に届かないので、計算量の差のほうが大きそう。(3) AdamW・LayerNorm の違い。

    DeiT が計算量の割に低いのは、ViT はスクラッチだと画像の構造の手がかり（帰納バイアス）が少なく、学習に時間がかかるためと推測。

    点は5つ・seed 1本なので「傾向」として述べる。学習率の最良：SGD 系は 0.025、AdamW 系は 1e-3。速度は 224px・バッチ128・PGD-3 の学習で測定。DeiT の揺れは seed を追加して確かめる予定。'
- section: 4. Phase 2
  type: table
  title: Phase 2：比べた要素
  script: 'Phase 2 では、MobileNetV4-S の基準に、要素を1つだけ足して比較しました。

    比べた要素は大きく2種類に分けられます。1つは、学習率の cosine 減衰や学習を長くすること、SiLU のような、学習データへの学習不足を補うものです。もう1つは、ラベル平滑化や強いデータ拡張、TRADES、AWP のような、過学習を抑えるものです。TRADES と AWP は敵対的訓練の代表的な改良で、CIFAR-10 の大きいモデルで効果が報告されています。

    勾配だけ滑らかは、Smooth Adversarial Training で提案された方法で、順方向は ReLU のまま、逆方向の勾配の計算だけを滑らかな関数のものに替えます。重みの更新にだけ使う場合と、学習中の攻撃を作るときにも使う場合の2通りを試しました。'
  point: MobileNetV4-S で、基準に要素を1つだけ足して比べた
  table:
    header:
    - 要素
    - 中身（一言で）
    - 種類
    rows:
    - - 学習率の cosine 減衰
      - 学習率を段階的でなく、なめらかに下げる
      - 学習不足を補う
    - - 100エポック
      - 学習の長さを2倍にする
      - 学習不足を補う
    - - SiLU [@sat]
      - 活性化関数 ReLU を滑らかな関数に替える
      - 学習不足を補う
    - - hard-swish [@mobilenetv3]
      - SiLU を折れ線で近似した関数に替える
      - 学習不足を補う
    - - 勾配だけ滑らか [@sat]
      - 順方向は ReLU のまま、勾配の計算だけ滑らかにする
      - 学習不足を補う
    - - weight decay 除外
      - 正規化層とバイアスには重み減衰をかけない
      - 学習不足を補う
    - - EMA
      - 重みの移動平均を最終モデルにする
      - 過学習を抑える
    - - ラベル平滑化 0.1
      - 正解ラベルを少しだけ他のクラスにも分ける
      - 過学習を抑える
    - - 強い拡張（IDBH）[@idbh]
      - 切り取り・色・反転などの拡張を強める
      - 過学習を抑える
    - - TRADES [@trades]
      - 攻撃前後の出力のずれに罰則を足す
      - 過学習を抑える
    - - AWP [@awp]
      - 重みも攻撃側に揺らして学習する
      - 過学習を抑える
    - - clean との混合 [@kurakin]
      - 攻撃していない画像も混ぜて学習する
      - 過学習を抑える
    - - SE [@mobilenetv3]
      - チャネルごとに重みを付ける部品を足す
      - 構造
    - - 構造の変更
      - 入力直後の層（ConvStem [@singh]）、深く細い形
      - 構造
    col_w:
    - 0.25
    - 0.55
    - 0.2
    size: 14
  notes: '学習不足を補う＝学習データに当てはまりやすくする工夫。過学習を抑える＝当てはまりすぎを防ぐ工夫（正則化など）。 AWP と TRADES は敵対的訓練の代表的な改良で、CIFAR-10 の大きいモデル（過学習が起きる状況）で効果が報告されている。 EMA も、過学習が起きる状況で効くとされる。

    勾配だけ滑らか：ReLU の微分（0 か 1）の代わりに softplus（β=10）の微分 σ(10x) を使う。①更新＝重みの勾配だけ。②攻撃＋更新＝学習中の PGD-3 で攻撃を作るときも。評価の攻撃は必ず本当の勾配。'
