        - [ラベル平滑化 0.1, 53.35 / 31.16 (+0.45), 予定, 予定, 59.63 / 37.61 (+0.69), 予定]
        - [SiLU, "55.45 / 33.27 (**+2.56**)", "61.26 / 38.33 (==−0.96==)※", もとから SiLU, もとから GELU, もとから GELU]
        - [SE, 54.32 / 31.12 (+0.41), —, もとから SE, —, —]
        - [weight decay 除外, "53.47 / 29.57 (==−1.14==)", —, —, —, —]
        - [100 エポック, 56.20 / 31.88 (+1.17), —, —, —, —]
        - [強い拡張（IDBH）, "52.48 / 29.29 (==−1.42==)", —, —, —, —]
        - [TRADES, "54.49 / 26.06 (==−4.65==)", —, —, —, —]
        - [AWP, "28.47 / 17.45 (==−13.26==)", —, —, —, —]
        - [clean と攻撃画像の混合, "62.88 / 17.34 (==−13.37==)", —, —, —, —]
        - [深く細い構造, —, —, —, "57.97 / 35.53 (==−1.39==)", —]
        - [ConvStem, —, —, —, 学習せず（後述）, 再試行予定]
      col_w: [0.17, 0.19, 0.17, 0.15, 0.17, 0.15]
      size: 12
      row_h: 0.3
    notes: >-
      夏の実験の全体。MobileNetV4-S で要素を1つずつ比較し、効きそうなものを他のモデルへ広げている。
      判定：差が1.5pt以上で効果あり、0.5〜1.5は保留（seed を足して確認）、0.5未満は効果なし。

  - section: 2. 進捗（結果）
    type: chart
    title: 要素ごとの効果（MobileNetV4-S）
    point: 最適化を助ける工夫は効き、正則化は逆効果
    chart:
      kind: bar
      categories: [SiLU, 100エポック, cosine, ラベル平滑化, SE, EMA, wd除外, IDBH, TRADES, AWP]
