- section: 2. 先行研究
  type: table
  title: Smooth Adversarial Training [@sat]
  script: |-
    Smooth Adversarial Training という研究では、ImageNet の ResNet-50 で、活性化関数を ReLU から SiLU に替えるだけで、頑健性が33.0%から42.3%に上がりました。これは、3倍深い ResNet-152 を ReLU のまま使った39.4%よりも高い値です。
    また、順方向は ReLU のままで、逆方向の勾配だけを滑らかにしても、36.9%まで上がると報告されています。この場合、推論するモデルは普通の ReLU のままです。
    ただし、この研究は ResNet-50 で、1回の攻撃で学習した場合だけです。軽量モデルや、3回の攻撃で学習する場合は確かめられていません。
  point: 3倍深いモデルより、活性化関数を滑らかにするほうが効いた
  table:
    header:
    - ImageNet・ResNet-50
    - clean
    - 頑健性
    rows:
    - - ReLU（基準）
      - '68.8'
      - '33.0'
    - - '**SiLU**'
      - '69.7'
      - '**42.3**'
    - - ReLU の ResNet-152（3倍深い）
      - —
      - '39.4'
    - - ReLU のまま、逆方向だけ滑らか（重みの更新）
      - '69.4'
      - '35.8'
    - - ReLU のまま、逆方向だけ滑らか（攻撃と更新）
      - '68.9'
      - '**36.9**'
    col_w:
    - 0.7
    - 0.15
    - 0.15
    highlight:
    - - 1
      - 2
    size: 14
    caption: 学習は PGD-1、評価は PGD-200（ε=4/255）。頑健性＝PGD-200 下の精度（%）
  side_w: 4.6
  side:
  - |-
    **使うところ**
    SiLU は私の実験でも +2.56pt
    順方向が ReLU のままでも効く
    → デプロイするモデルは変わらない
  - '滑らかさは小さいモデルほど効く

    [@bag_of_tricks]'
  - '**違うところ**

    ResNet-50・1回攻撃の学習だけ

    軽量モデルと3回攻撃では未検証'
  notes: 「順方向は ReLU のまま、逆方向だけ滑らか」は、推論時は普通の ReLU のモデルになる。 スマホの DSP（チップの中の演算器。掛け算や max は速いが、sigmoid や exp は苦手）でも遅くならない。
- section: 3. Phase 1
  type: cards
  title: Phase 1：各モデルの基準作り（設定）
  script: |-
    ここから進捗です。Phase 1 は、各モデルの基準を作る段階です。
    5つのモデルを同じ条件で学習しました。ImageNet を224ピクセルで使い、スクラッチから50エポック学習します。学習中の攻撃は PGD-3、評価は PGD-10 です。評価には、学習データのうち25,620枚を学習に使わずに取り分けた内部検証を使っています。
    変えたのはモデルと最適化手法、そして学習率で、各モデルで3〜5点を試して最良のものを基準にしました。
    また Phase 1 で、2段階の学習より通常の学習のほうが良いこと、事前学習モデルは使わないこと、30エポックでは足りないので50エポックにすることを決めました。
  point: 5モデルを同じ条件で学習し、学習率だけ探して最良を基準にした
  cols: 3
  cards:
  - head: 共通の設定
    body:
    - 'ImageNet-1k、224 px

      スクラッチから50エポック'
    - '学習の攻撃：PGD-3

      評価の攻撃：PGD-10（ε=4/255）'
    - 'バッチ128、GPU 1枚

      拡張：切り抜き＋左右反転'
    - '評価：**内部検証**

      学習データから 25,620枚を

      学習に使わず取り分けて評価'
  - head: 変えたもの
    body:
    - モデル（5種類）
    - '最適化手法

      BN の CNN：SGD

      LN のモデル：AdamW'
    - '学習率：各モデル3〜5点

      例 SGD 0.0125 / 0.025 / 0.05'
  - head: Phase 1 で決めたこと
    body:
    - '2段階の学習（低解像度→

      高解像度）より通常の学習

      （2段階は −2.26pt）'
    - '事前学習モデルは使わない

      （スクラッチのみ）'
    - '30エポックは −1.7pt

      → 50エポックに'
  notes: 学習率は10エポックで上げ、25・38エポックで1/10に下げる。2段階学習は AdvXL 型 [@advxl]。
- section: 3. Phase 1
  type: table
  title: Phase 1：結果と考察
  script: |-
    Phase 1 の結果です。最良の学習率での PGD-10 は、30.7%から39.4%でした。
    まず、大きいモデルほど頑健で、9.7M の MobileNetV4-M が39.4%と最も高くなりました。一方で、ConvNeXt-Atto は3.7M と小さいにもかかわらず37.0%と高い値です。ただし計算量は MobileNetV4-S の約3倍あります。
    また、計算量と学習速度は別物で、DeiT は計算量が最も大きいのに学習は比較的速く、EfficientNet-B0 は計算量の割に遅いという違いがありました。
    学習率によって最大2.4ポイント変わること、DeiT だけ乱数の種による揺れが1.37ポイントと大きいことも分かりました。DeiT の揺れの原因はまだ分かっておらず、seed を追加して確かめる予定です。
  point: 大きいほど頑健。ただし ConvNeXt-Atto は小さい割に高い
