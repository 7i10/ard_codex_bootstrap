- section: 4. Phase 2
  type: table
  title: Phase 2：比べた要素
  script: |-
    Phase 2 では、MobileNetV4-S の基準に、要素を1つだけ足して比較しました。
    比べた要素は大きく2種類に分けられます。1つは、学習率の cosine 減衰や学習を長くすること、SiLU のような、学習データへの学習不足を補うものです。もう1つは、ラベル平滑化や強いデータ拡張、TRADES、AWP のような、過学習を抑えるものです。TRADES と AWP は敵対的訓練の代表的な改良で、CIFAR-10 の大きいモデルで効果が報告されています。
  point: MobileNetV4-S で、基準に要素を1つだけ足して比べた
  table:
    header:
    - 要素
    - 中身（一言で）
    - 種類
    rows:
    - - 学習率の cosine 減衰
      - 学習率を段階的でなく、なめらかに下げる
      - 学習不足を補う
    - - 100エポック
      - 学習の長さを2倍にする
      - 学習不足を補う
    - - SiLU [@sat]
      - 活性化関数 ReLU を滑らかな関数に替える
      - 学習不足を補う
    - - weight decay 除外
      - 正規化層とバイアスには重み減衰をかけない
      - 学習不足を補う
    - - EMA
      - 重みの移動平均を最終モデルにする
      - 過学習を抑える
    - - ラベル平滑化 0.1
      - 正解ラベルを少しだけ他のクラスにも分ける
      - 過学習を抑える
    - - 強い拡張（IDBH）[@idbh]
      - 切り取り・色・反転などの拡張を強める
      - 過学習を抑える
    - - TRADES [@trades]
      - 攻撃前後の出力のずれに罰則を足す
      - 過学習を抑える
    - - AWP [@awp]
      - 重みも攻撃側に揺らして学習する
      - 過学習を抑える
    - - clean との混合 [@kurakin]
      - 攻撃していない画像も混ぜて学習する
      - 過学習を抑える
    - - SE [@mobilenetv3]
      - チャネルごとに重みを付ける部品を足す
      - 構造
    col_w:
    - 0.27
    - 0.5
    - 0.23
