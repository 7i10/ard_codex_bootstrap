  notes: '対象は「軽量」。計算量（GMACs）は各モデルごとに示す（境界は設けない）。

    先行研究の調査（2026-10-18、論文本文で確認）。ImageNet-1k で 11.7M 未満のモデルの頑健性を報告したのは5本：

    ・Smooth AT（Xie+ 2020, arXiv:2006.14536）：EfficientNet-B0 65.1 / 37.6（PGD-1 学習・PGD-200 評価、本文と図のみ）

    ・RobustART（2021, arXiv:2109.05211）：ShuffleNetV2・MobileNetV3、ε=8/255、図のみ（数値とスクラッチかは要確認）

    ・Wu+（ECCV 2022）：ViT-Tiny・LeViT、Fast AT（1回攻撃）、ViT-Ti 64.03 / 31.20（ε=4/255 で学習したモデルかは要確認）

    ・EasyRobust（2025, arXiv:2503.16975）：EfficientNet-B0〜B2、B0 61.83 / 35.06（AutoAttack。学習の攻撃回数とエポックは要確認）

    ・Awad+（2025, arXiv:2512.02830）：MobileNetV2/V3・EfficientNet・ViT-Ti など多数、Free AT、ε=2/255、主題は転移攻撃（スクラッチかは要確認）

    新規性（控えめに）：

    (1) MobileNetV4・ConvNeXt-Atto の ImageNet 敵対的訓練は報告なし。CNN・ConvNeXt・ViT の 10M 未満5モデルを ε=4/255・複数回 PGD で揃えて比べた例もない。

    (2) 「学習不足で、過学習を抑える手法は逆効果」を 10M 未満で体系的に示した例はない（近い先行研究：Light Recipe＝主に ImageNet-100 の ViT、Mo+ 2022＝Imagenette）。

    (3) 小型 CNN での ReLU・SiLU・hard-swish の比較と、実機 NPU の推論時間の組み合わせはない。

    注意：「小型モデルで初めて敵対的訓練」とは言えない（Awad+）。中国語・ワークショップ論文は未調査。'
- section: 1. 研究内容
  type: cards
  title: この夏のまとめ（先に要点）
  script: '最初に、この夏の要点を3つお伝えします。

    1つ目は、軽量モデルは敵対的訓練で学習不足になることです。学習に使った画像に対してでも、頑健性は34%程度にとどまります。どの画像のどんな小さな変化にも正しく答えるという課題が、小さいモデルには重いのだと考えています。

    2つ目は、過学習を抑える手法は逆効果で、学習不足を補う手法は効くことです。例えば活性化関数を SiLU に替えると、PGD-10 が2.56ポイント上がりました。

    3つ目は、学習不足を補う工夫の中でも、活性化関数が特に効くことです。SiLU で2.56ポイント、hard-swish で1.91ポイント上がり、hard-swish はスマートフォンの NPU でも ReLU とほぼ同じ速さで動きます。そこから、学習中だけ容量を足す工夫へ進んでいます。

    大きいモデルを使えば頑健性は上がりますが、私の研究では、軽量という制約の中でどう上げるかを扱います。'
  point: 軽量モデルのままでも、学習のさせ方で頑健性を上げる余地がある
  cols: 3
  cards:
  - head: ① 学習不足
    body:
    - '学習に使った画像でも

      頑健性は 34% 止まり'
    - '敵対的訓練は「どの画像の

      どんな小さな変化にも正しく

      答える」重い課題で、

      小さいモデルは当てはまり

      きれていない（と考える）'
  - head: ② 効くもの・効かないもの
    body:
    - '**過学習を抑える手法は逆効果**

      AWP、TRADES、強い拡張'
    - '**学習不足を補う**

      **手法は効く**

      SiLU **+2.56pt**

      cosine 減衰 +0.78pt

      学習を2倍に +1.17pt'
  - head: ③ 活性化関数が鍵
    body:
    - 'SiLU で **+2.56pt**

      hard-swish で **+1.91pt**'
    - 'hard-swish はスマホの

      NPU でも ReLU と同じ速さ'
    - '→ 学習中だけの工夫

      （再パラメータ化）へ'
  notes: 大きいモデルにすれば頑健性は上がる。研究対象は「軽量」という制約の中でどう上げるか。 Phase 1・2 の結果から、軽量モデルは表現力より前に「学習しきれていない」ことがわかった。そこで学習不足を補う方向で手法を考える。
- section: 2. 先行研究
  type: chart
  title: 活性化関数の違い
  script: '先行研究の紹介の前に、活性化関数の違いを説明します。

    ReLU は負の入力を0にする関数で、0のところで折れ曲がっています。そのため、勾配が0から1に急に変わります。計算は0と比べて大きいほうを取るだけなので、スマートフォンのチップでも速く、前の畳み込みと一緒に処理できます。

    SiLU は x にシグモイド関数を掛けた関数で、ReLU をなめらかにした形です。GELU も SiLU とほぼ同じ形ですが、シグモイド関数ではなく正規分布の累積分布関数を使います。ConvNeXt や ViT で標準的に使われています。どちらも指数関数や誤差関数といった重い計算が必要です。

    hard-swish は、SiLU を折れ線で近似したもので、MobileNetV3 で提案されました。比較と掛け算だけで計算できるので、スマートフォンのチップでも速く計算できます。'
  point: ReLU は 0 で折れ曲がる。SiLU・GELU・hard-swish はなめらか
