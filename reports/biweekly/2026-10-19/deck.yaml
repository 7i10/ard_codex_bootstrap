      計算量あたり、どのモデルが

      頑健になりやすいか'
    - 'RQ2　モデルごとの

      効果的な学習法'
    - 'RQ3　学習不足の要因と

      軽量のままでの対処'
  - head: 評価の指標
    body:
    - 敵対的訓練（PGD-AT）[@madry]
    - '**clean**：攻撃なしの精度'
    - '**PGD-10**：10反復の

      PGD 攻撃（ε=4/255）

      での精度'
  timeline:
  - label: Phase 1
