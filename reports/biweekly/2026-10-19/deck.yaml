- section: 1. 研究内容
  type: cards
  title: この夏のまとめ（先に要点）
  script: |-
    最初に、この夏の要点を3つお伝えします。
    1つ目は、軽量モデルは敵対的訓練で学習不足になることです。学習に使った画像に対してでも、頑健性は34%程度にとどまります。どの画像のどんな小さな変化にも正しく答えるという課題が、小さいモデルには重いのだと考えています。
    2つ目は、過学習を抑える手法は逆効果で、学習不足を補う手法は効くことです。例えば活性化関数を SiLU に替えると、PGD-10 が2.56ポイント上がりました。
    3つ目は、学習不足を補う工夫の中でも、活性化関数が特に効くことです。SiLU で2.56ポイント、hard-swish で1.91ポイント上がり、hard-swish はスマートフォンの NPU でも ReLU とほぼ同じ速さで動きます。そこから、学習中だけ容量を足す工夫へ進んでいます。
    大きいモデルを使えば頑健性は上がりますが、私の研究では、軽量という制約の中でどう上げるかを扱います。
  point: 軽量モデルのままでも、学習のさせ方で頑健性を上げる余地がある
  cols: 3
  cards:
  - head: ① 学習不足
    body:
    - '学習に使った画像でも

      頑健性は 34% 止まり'
    - |-
      敵対的訓練は「どの画像の
      どんな小さな変化にも正しく
      答える」重い課題で、
      小さいモデルは当てはまり
      きれていない（と考える）
  - head: ② 効くもの・効かないもの
    body:
    - '**過学習を抑える手法は逆効果**

      AWP、TRADES、強い拡張'
    - |-
      **学習不足を補う**
      **手法は効く**
      SiLU **+2.56pt**
      cosine 減衰 +0.78pt
      学習を2倍に +1.17pt
  - head: ③ 活性化関数が鍵
    body:
    - 'SiLU で **+2.56pt**

      hard-swish で **+1.91pt**'
    - 'hard-swish はスマホの

      NPU でも ReLU と同じ速さ'
    - '→ 学習中だけの工夫

      （再パラメータ化）へ'
  notes: 大きいモデルにすれば頑健性は上がる。研究対象は「軽量」という制約の中でどう上げるか。 Phase 1・2 の結果から、軽量モデルは表現力より前に「学習しきれていない」ことがわかった。そこで学習不足を補う方向で手法を考える。
- section: 2. 先行研究
  type: chart
  title: 活性化関数の違い
  script: |-
    先行研究の紹介の前に、活性化関数の違いを説明します。
    ReLU は負の入力を0にする関数で、0のところで折れ曲がっています。そのため、勾配が0から1に急に変わります。
    SiLU は x にシグモイドを掛けた関数で、ReLU をなめらかにした形です。GELU も SiLU とほぼ同じ形で、ConvNeXt や ViT で標準的に使われています。
    hard-swish は、SiLU を折れ線で近似したもので、MobileNetV3 で提案されました。シグモイドを使わないので、スマートフォンのチップでも速く計算できます。
  point: ReLU は 0 で折れ曲がる。SiLU・GELU・hard-swish はなめらか
