- section: 6. まとめ
  type: cards
  title: 次の一手
  point: 学習中だけ容量を足し、デプロイするモデルは変えない（構造の再パラメータ化）
  cols: 3
  cards:
  - head: 仮説
    body:
    - '軽量モデルの形の中にも

      もっと良い解はある'
    - '見つけられないのは

      学習（最適化）の問題'
    - '→ 学習中だけの工夫で

      頑健性を上げられるはず'
  - head: 活性化関数
    body:
    - 'S・M とも

      SiLU と hard-swish の

      学習率を探す'
    - '最良の学習率同士で比べ

      頑健性と実機の速さを

      並べる'
  - head: 構造の再パラメータ化
    body:
    - '学習中だけ枝を足し

      後で1つの層にまとめる

      [@repvgg, @mobileone]

      （推論は元の S と同じ）'
    - '実装済み。学習の計算は

      普通の S の約 2.45倍

      （M とほぼ同じ）

      → 同じ GPU 時間で

      M と比べる'
    - 敵対的訓練では未検証
  script: '次の一手です。軽量モデルの形の中にももっと良い解があり、それを見つけられないのは学習の問題だという仮説のもと、学習中だけの工夫を試します。

    1つ目は活性化関数で、MobileNetV4-S と M の両方で、SiLU と hard-swish の学習率を探し、最良の学習率同士で比べて、頑健性と実機の速さを並べます。

    2つ目は構造の再パラメータ化です。学習中だけ各層に枝を足して容量を増やし、学習後にそれを1つの層にまとめます。推論するモデルは元の MobileNetV4-S と同じです。実装は終わっていて、学習の計算量は普通の MobileNetV4-S の約2.45倍で、MobileNetV4-M とほぼ同じです。そこで、同じ GPU 時間で MobileNetV4-M と比べ、大きいモデルに迫れるかを確かめます。'
  notes: 蒸留の検証は、活性化関数の結果を見てから始める（生徒の活性化関数を決めてから）。再パラメータ化の土台は hard-swish の S。
- section: 6. まとめ
  type: cards
  title: まとめ
  script: 'まとめです。分かったことは、軽量モデルは敵対的訓練で学習不足になること、過学習を抑える手法は逆効果で学習不足を補う手法が効くこと、そして活性化関数は順方向の形そのものが効き、hard-swish なら実機でも速いことです。

    まだ分からないことは、SiLU が MobileNetV4-M で逆向きになる理由、再パラメータ化で MobileNetV4-M に迫れるか、DeiT の seed の揺れの原因です。

    今後考えるべき点として、提案手法の形、学習率を下げたときの急な上昇を利用できないか、判定の基準をモデルごとに変えるかを挙げています。'
  point: 学習不足が共通の原因。軽量のまま学習不足を補う方向で手法を組み立てる
  cols: 3
  cards:
  - head: わかったこと
    body:
    - '軽量モデルは

      敵対的訓練で学習不足'
    - '過学習を抑える手法は逆効果

      学習不足を補うと効く'
    - '活性化関数は

      順方向の形が効く

      hard-swish は実機でも速い'
  - head: まだわからないこと
    body:
    - 'SiLU が M で

      逆向きになる理由'
    - '再パラメータ化で

      M に迫れるか'
    - 'DeiT の seed の揺れ

      （1.37pt）の原因'
  - head: 考えるべき点
    body:
    - '提案手法の形

      （何を学習中だけ足すか）'
    - '学習率を下げたときの

      急な上昇を利用できないか'
    - '判定の基準（0.5 / 1.5pt）を

      モデルごとに変えるか'
  notes: 冒頭の3つの要点をここで回収する。
- section: 7. 計画
  type: plan
  title: 今後の計画
  script: '今後の計画です。次回までに、活性化関数の学習率探索として、MobileNetV4-S の学習率を下げた SiLU と hard-swish、MobileNetV4-M の hard-swish から始めます。GPU での推論時間も、GPU が空いたときに測ります。並行して、構造の再パラメータ化の実験を、MobileNetV4-M と同じ GPU 時間で行います。β2 を0.95にした ConvStem の再試行も進めます。蒸留の検証は、活性化関数が決まってから始めます。10月28日以降は、結果を見て決めます。

    修士論文までの見通しとしては、11月に提案手法を決めて本実験を行い、12月に効いた要素を組み合わせて AutoAttack で評価し、1月に執筆に入る予定です。以上です。'
  point: 蒸留の検証と、提案手法の最初の実験
