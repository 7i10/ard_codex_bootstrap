# 2026-10-19 定期ゼミ（夏の成果: plan 0103 Phase 1 〜 plan 0107）。数字の出典は facts.md。
# 改行の目安（Mac PowerPoint、游ゴシック）: 3列カード 約14字/行、2列カード 約22字/行、右の補足欄 約16字/行。
meta:
  event: 定期ゼミ
  title: "軽量画像認識モデルの ImageNet 敵対的訓練\n― 学習不足の要因と対処 ―"
  date: 2026年 10月19日（月）
  affiliation: [早稲田大学　基幹理工学研究科　電子物理システム学専攻, 史研究室　修士2年]
  name: 内藤 舜介
references_file: ../references.yaml
slides:
  # ------------------------------------------------------------------ 1. 研究内容
  - section: 1. 研究内容
    type: overview
    title: 研究の全体像
    point: スマホ向けの軽量モデルを、ImageNet で敵対的攻撃に頑健にする
    blocks:
      - head: 目指すもの
        body:
          - "**軽量**＝パラメータ1000万未満\n　かつ 計算量1.1 GMACs以下"
          - "対象5モデル（3.7〜9.7M）\nMobileNetV4-S/M [@mobilenetv4]\nEfficientNet-B0 [@efficientnet]\nConvNeXt-Atto [@convnext]\nDeiT-Tiny [@deit]"
      - head: 問い
        body:
          - "RQ1　効率\n精度と計算時間の最前線"
          - "RQ2　モデルごとの\n正しい学習法"
          - "RQ3　学習不足の仕組みと\n大きいモデル以上の対処"
      - head: 共通の設定
        body:
          - "敵対的訓練（PGD-AT）[@madry]\nスクラッチから50エポック"
          - "**clean**：攻撃なしの精度"
          - "**PGD-10**：10回攻撃した後の\n精度（ε=4/255）"
    timeline:
      - {label: Phase 1, note: 5モデルの基準と学習率}
      - {label: Phase 2, note: 要素を1つずつ比較}
      - {label: 提案の方向, note: 学習中だけ容量を足す, current: true}
      - {label: 蒸留の検証, note: 10月下旬〜}
    notes: >-
      軽量の定義（1000万パラメータ未満、1.1 GMACs 以下）。GMACs は1枚の画像の推論に必要な積和演算の回数（10億回単位）。
      評価は学習データから取り分けた25,620枚（内部検証）。この夏は Phase 1 → Phase 2 → 提案の方向、と進んだ。

  # ------------------------------------------------------------------ 2. 進捗（結果）
  - section: 2. 進捗（結果）
    type: cards
    title: この夏の結論
    point: 小さいモデルの弱点は、容量より最適化（仮説）
    cols: 3
    cards:
      - head: ① 学習不足
        body:
          - "軽量モデルは敵対的訓練で\n学習不足になる"
          - "検証の頑健性は\n最後まで上がり続ける"
      - head: ② 効くもの・効かないもの
        body:
          - "正則化は ==逆効果=="
          - "最適化を助ける工夫は効く\n（SiLU で **+2.56pt**）"
      - head: ③ 提案の方向
        body:
          - "学習中だけ容量や\n滑らかさを足す"
          - "デプロイするモデルは\n変えない"
          - "最初の3本を実行中"
    notes: 先に結論を3つ言う。最後のまとめで同じ3つを回収する。

  - section: 2. 進捗（結果）
    type: table
    title: Phase 1：5モデルの基準
    point: 最良の学習率で、PGD-10 は 30.7〜39.4%
    table:
      header: [モデル, パラメータ, GMACs, 学習速度, 最良の学習率, clean / PGD-10, seed の揺れ]
      rows:
        - ["MobileNetV4-S [@mobilenetv4]", 3.8M, "0.19", 1364 枚/秒, SGD 0.025, 53.85 / 30.71, "0.36"]
        - ["MobileNetV4-M [@mobilenetv4]", 9.7M, "0.83", 522 枚/秒, SGD 0.025, 63.79 / **39.39**, "0.09"]
        - ["EfficientNet-B0 [@efficientnet]", 5.3M, "0.39", 346 枚/秒, SGD 0.025, 58.22 / 35.93, "0.17"]
        - ["ConvNeXt-Atto [@convnext]", 3.7M, "0.55", 741 枚/秒, AdamW 1e-3, 59.96 / 37.02, "0.36"]
        - ["DeiT-Tiny [@deit]", 5.7M, "1.07", 約560 枚/秒, AdamW 1e-3, 58.63 / 35.00, "==1.37=="]
      col_w: [0.22, 0.11, 0.09, 0.13, 0.15, 0.18, 0.12]
      size: 15
      caption: "GMACs＝1枚の推論の積和演算回数（10億回）。学習速度＝RTX 4090・バッチ128・PGD-3。seed の揺れ＝乱数の種を変えたときの PGD-10 の差"
    notes: >-
      Phase 1 で決めたこと：2段階学習より通常の敵対的訓練（2段階は PGD-10 −2.26pt）、事前学習は使わない、
      30エポックは −1.7pt なので50エポック、学習率は全モデル3点以上を探索（MobileNetV4-M は半分で −2.4pt）。
      DeiT だけ seed の揺れが 1.37 と大きい。

  - section: 2. 進捗（結果）
    type: table
    title: Phase 2 で比べた要素
    point: 「最適化を助ける」ものと「正則化」の2種類を比べた
    table:
      header: [要素, 中身（一言で）, 種類]
      rows:
        - [EMA, 重みの移動平均を最終モデルにする, 平均化]
        - ["cosine（学習率）", 学習率を段階的でなく、なめらかに下げる, 最適化]
        - [100エポック, 学習の長さを2倍にする, 最適化]
        - ["SiLU [@sat]", "活性化関数 ReLU を滑らかな関数に替える（次節）", 最適化]
        - ["SE [@mobilenetv3]", チャネルごとに重みを付ける小さな部品を足す, 構造]
        - [weight decay 除外, 正規化層とバイアスには重み減衰をかけない, 正則化を弱める]
        - [ラベル平滑化 0.1, 正解ラベルを少しだけ他のクラスにも分ける, 正則化]
        - ["強い拡張（IDBH）[@idbh]", 画像の切り取りや色の変換を強める, 正則化]
        - ["TRADES [@trades]", 攻撃前後の出力のずれに罰則を足す, 正則化]
        - ["AWP [@awp]", 重みも攻撃側に揺らして学習する, 正則化]
        - ["clean と攻撃画像の混合 [@kurakin]", 攻撃していない画像も混ぜて学習する, 正則化]
      col_w: [0.27, 0.55, 0.18]
      size: 15
      row_h: 0.42
    notes: >-
      正則化＝学習データへの当てはまりを抑えて、過学習を防ぐ工夫。最適化を助ける＝当てはまりやすくする工夫。
      AWP と TRADES は敵対的訓練の代表的な改良で、CIFAR-10 の大きいモデルで効果が報告されている。

  - section: 2. 進捗（結果）
    type: table
    full: true
    title: 実験の一覧（clean / PGD-10、括弧内は基準との差）
    table:
      caption_pos: top
      caption: "内部検証 25,620 枚・最終エポック・seed 0。**太字**＝効果あり（+1.5pt 以上）、==赤==＝0.5pt 以上の低下。※ Phase 1 seed 1 比の暫定値"
      header: ["訓練", "MobileNetV4-S\n3.8M", "MobileNetV4-M\n9.7M", "EfficientNet-B0\n5.3M", "ConvNeXt-Atto\n3.7M", "DeiT-Tiny\n5.7M"]
      rows:
