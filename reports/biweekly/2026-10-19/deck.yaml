# 2026-10-19 定期ゼミ（夏の成果: plan 0103 Phase 1 〜 plan 0107）。数字の出典は facts.md。
meta:
  event: 定期ゼミ
  title: "軽量画像認識モデルの ImageNet 敵対的訓練\n― 学習不足の要因と対処 ―"
  date: 2026年 10月19日（月）
  affiliation: [早稲田大学　基幹理工学研究科　電子物理システム学専攻, 史研究室　修士2年]
  name: 内藤 舜介
references_file: ../references.yaml
slides:
  # ------------------------------------------------------------------ 1. 研究内容
  - section: 1. 研究内容
    type: overview
    title: 研究の全体像
    point: スマホ向けの軽量モデルを、ImageNet で敵対的攻撃に頑健にする
    cite: [mobilenetv4, madry]
    blocks:
      - head: 目指すもの
        body:
          - "**軽量モデル**＝パラメータ 1000万未満・計算量 1.1 GMACs 以下"
          - 対象：MobileNetV4-S/M, EfficientNet-B0, ConvNeXt-Atto, DeiT-Tiny（3.7M〜9.7M）
          - 敵対的訓練（PGD-AT）で頑健にする
      - head: 問い
        body:
          - RQ1　効率：精度と計算時間の最前線
          - RQ2　モデルごとの正しい学習法
          - RQ3　学習不足の仕組みと、大きいモデルを使う以上の対処
      - head: 共通の設定
        body:
          - ImageNet-1k・スクラッチ・50 エポック
          - "学習 PGD-3、評価 PGD-10（L∞ ε=4/255）"
          - 学習データから取り分けた 25,620 枚で評価
    timeline:
      - {label: Phase 1, note: 5モデルの基準と学習率}
      - {label: Phase 2, note: 要素を1つずつ比較}
      - {label: 提案の方向, note: 学習中だけ容量を足す, current: true}
      - {label: 蒸留の検証, note: 10月下旬〜}
    notes: >-
      研究の目的と問いの確認。軽量の定義をここで明確にする（1000万パラメータ未満、1.1 GMACs 以下）。
      この夏は Phase 1（各モデルの基準）→ Phase 2（要素ごとの比較）→ 提案の方向、と進んだ。

  # ------------------------------------------------------------------ 2. 進捗（結果）
  - section: 2. 進捗（結果）
    type: cards
    title: この夏の結論
    point: 小さいモデルの弱点は、容量より最適化
    cols: 3
    cards:
      - head: ① 学習不足
        body: [軽量モデルは敵対的訓練で学習不足になる, 学習画像と検証の差は約 4pt、検証の頑健性は最後まで上昇]
      - head: ② 効くもの・効かないもの
        body: ["正則化（AWP, TRADES, 強い拡張）は ==逆効果==", "最適化を助ける工夫（SiLU **+2.56pt**, cosine）は効く"]
      - head: ③ 提案の方向
        body: [学習中だけ容量や滑らかさを足し、デプロイするモデルは変えない, 最初の3本を実行中]
    notes: 先に結論を3つ言う。最後のまとめで同じ3つを回収する。

  - section: 2. 進捗（結果）
    type: table
    title: Phase 1：5モデルの基準
    point: 最良の学習率で、PGD-10 は 30.7〜39.4%
    cite: [mobilenetv4, efficientnet, convnext, deit]
    table:
      header: [モデル, パラメータ, GMACs, 学習速度, 最良の学習率, clean / PGD-10, seed の揺れ]
      rows:
        - [MobileNetV4-S, 3.8M, 0.19, 1364 枚/秒, SGD 0.025, 53.85 / 30.71, 0.36]
        - [MobileNetV4-M, 9.7M, 0.83, 522 枚/秒, SGD 0.025, 63.79 / **39.39**, 0.09]
        - [EfficientNet-B0, 5.3M, 0.39, 346 枚/秒, SGD 0.025, 58.22 / 35.93, 0.17]
        - [ConvNeXt-Atto, 3.7M, 0.55, 741 枚/秒, AdamW 1e-3, 59.96 / 37.02, 0.36]
        - [DeiT-Tiny, 5.7M, 1.07, 約 560 枚/秒, AdamW 1e-3, 58.63 / 35.00, ==1.37==]
      col_w: [0.2, 0.11, 0.09, 0.14, 0.15, 0.19, 0.12]
      size: 15
      caption: 学習速度は Hamster の RTX 4090（224 px、バッチ 128、PGD-3）。DeiT は実 run の値。seed の揺れ＝seed 0 と 1 の PGD-10 の差
    side_w: 0
    notes: >-
      Phase 1 で決めたこと：2段階学習より full AT（2段階は PGD-10 −2.26pt）、事前学習は使わない、
      30 エポックは −1.7pt なので 50 エポック、学習率は全モデル3点以上を探索（MobileNetV4-M は半分で −2.4pt）。
      DeiT だけ seed の揺れが 1.37 と大きい。

