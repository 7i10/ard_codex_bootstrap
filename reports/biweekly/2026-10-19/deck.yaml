- section: 4. Phase 2
  type: chart
  title: 学習不足の証拠（MobileNetV4-S）
  script: 'では、なぜ過学習を抑える手法が逆効果なのか。それは、今のモデルが過学習ではなく学習不足だからだと考えています。

    このグラフは、学習に使った画像と検証画像それぞれの PGD-10 の推移です。過学習していれば、学習画像だけ上がって検証は後半で下がるはずですが、どちらも最後まで上がり続けています。また、学習画像でも頑健性は34%程度で、当てはまりきれていません。

    AWP は学習画像と検証の差を縮めていますが、それは当てはまりそのものを下げたためです。

    25エポック目の急な上昇は学習率を10分の1にした効果で、cosine 減衰ではなめらかに上がり、最後は上回ります。学習を2倍にすると1.17ポイント上がりますが、計算も2倍になるので、計算を増やさずに上げる方法を探しています。'
