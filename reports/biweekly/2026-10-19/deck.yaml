slides:
- section: 1. 研究内容
  type: overview
  title: 研究の全体像
  script: '本研究は、パラメータ数が10M未満の軽量な画像認識モデルを、ImageNet で敵対的攻撃に頑健にすることを目指しています。ImageNet での敵対的訓練の先行研究は、ResNet-18 の11.7M以上のモデルが中心で、それより小さいモデルの報告は数本あるものの、複数のモデルを同じ条件で比べた研究は見当たりません。そこで、MobileNetV4 など5つの軽量モデルを対象にしています。

    問いは3つです。計算量あたりどのモデルが頑健になりやすいか、モデルごとに効果的な学習法は何か、そして学習不足の要因と、軽量のままでの対処です。

    評価には、攻撃なしの精度である clean と、10反復の PGD 攻撃を受けたときの精度である PGD-10 を使います。この夏は、Phase 1 で各モデルの基準を作り、Phase 2 で要素を1つずつ比較し、そこから提案の方向を考えました。'
  point: 軽量モデル（パラメータ 10M 未満）を、ImageNet で敵対的攻撃に頑健にする
  blocks:
  - head: 対象
    body:
    - '**軽量**＝パラメータ 10M 未満'
    - 'ImageNet の敵対的訓練の

      先行研究は ResNet-18

      （11.7M）以上が中心

      → より小さいモデルは報告が

      少なく、揃えた比較はない'
    - '対象5モデル（3.7〜9.7M）

