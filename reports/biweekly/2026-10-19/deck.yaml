  - section: 4. Phase 2
    type: figure
    title: ConvStem が学習しなかった原因
    script: |-
      ConvStem は、入力直後の層を小さな畳み込みの積み重ねに替える工夫で、先行研究では頑健性が上がると報告されています。
      しかし ConvNeXt-Atto で試したところ、50エポックの間ずっと当てずっぽうの精度のままでした。調べると、stem の出力の約4割が、どの画像でも同じ値になっていました。この部分が大きいと、後ろの層で画像の違いが消え、どの画像にも同じ答えを出す状態に落ちてしまいます。
      先行研究との違いは、最適化手法 AdamW の β2 という設定で、先行研究は0.95、私たちは0.999でした。0.999だと更新が止まったまま抜け出せないことを確かめたので、0.95で再試行しています。また、学習していない場合は2エポックで止める仕組みを入れました。
    point: AdamW の β2 が先行研究と違ったため、どの画像にも同じ答えを出す状態に落ちた
    image: fig_stem.png
    caption: "ConvStem [@singh]：stem（入力直後の層）を小さな畳み込みの積み重ねに替える。ViT で頑健性 +2.6pt と報告"
    side_w: 5.0
    side:
      - "**起きたこと**：50エポック当てずっぽう\n（0.1%）のまま「完了」していた"
      - "**仕組み**：stem の出力の約4割が\nどの画像でも同じ値（画像の違いが\n乗っていない部分）→ 後ろの層で\n違いが消え、どの画像にも同じ答えに"
      - "**原因**：AdamW の β2（勾配の大きさを\n覚えておく長さ）が Singh らは 0.95、\n私たちは 0.999。0.999 だと\n更新が止まったまま抜け出せない"
      - "**対応**：β2=0.95 で4本再試行。\n学習しない run を2エポックで\n止める見張りを追加"
    notes: >-
      一定成分の割合：ConvStem 0.42、標準の stem 0.003。CPU で1要因ずつ変えた実験で、結果を変えたのは β2 だけ。
      Singh らの大きいバッチ（約1,392）は未検証。ConvNeXt では Singh らでも効果は +0.5pt と小さい。

  # ================================================================== 5. まとめと提案の方向
  - section: 5. まとめと提案
    type: cards
    title: 提案の方向と、最初の3本の結果
    script: |-
      ここまでの結果から、提案の方向を考えました。軽量モデルの形の中にももっと良い解はあり、それを見つけられないのは学習の問題だという仮説です。そこで、学習中だけ当てはまりを助けて、デプロイするモデルは変えない工夫を試しました。
      最初の3本の結果です。hard-swish は1.91ポイント上がり、SiLU の約75%の効果がありました。hard-swish はスマートフォンのチップでも速く計算できます。
      一方で、順方向は ReLU のまま勾配だけを滑らかにする案は、重みの更新だけに使うと1.22ポイント、攻撃と更新の両方に使うと7.19ポイント下がりました。先行研究とは逆の結果で、理由は次回までに調べます。
      次は、hard-swish を他のモデルに広げることと、学習中だけ枝を足す構造の再パラメータ化を試します。
    point: hard-swish は +1.91pt で効いた。勾配だけ滑らかにする案は逆効果
    cols: 3
    cards:
      - head: 仮説
        body:
          - "軽量モデルの形の中にも\nもっと良い解はある"
          - "見つけられないのは\n学習（最適化）の問題"
          - "→ 学習中だけの工夫で\n頑健性を上げられるはず"
      - head: 結果（S、PGD-10 の差）
        body:
          - "**hard-swish**：**+1.91pt**\nSiLU（+2.56）の約 75%\nスマホのチップでも速い"
          - "**勾配だけ滑らか**\n① 重みの更新だけ：==−1.22==\n② 攻撃と更新：==−7.19==\n（clean は +2.06）"
          - "SAT（ResNet-50）とは逆の結果"
      - head: 次の候補
        body:
          - "**hard-swish を他のモデルへ**\n（まず MobileNetV4-M）"
          - "**構造の再パラメータ化**\n[@repvgg, @mobileone]\n学習中だけ枝を足し\n後で1つの層にまとめる"
          - "敵対的訓練では未検証"
    notes: >-
      新しい3本は非決定的モード、比べる基準と SiLU は決定的モードで回した（設定の差による影響はこれまで揺れの範囲）。seed は1本。
      ② は学習中の攻撃も滑らかな勾配で作るので、攻撃が本当のモデルに対して弱くなり、弱い攻撃にしか強くならなかった可能性が高い。
      ① が効かなかった理由は未確認。考察は次回。

  - section: 5. まとめと提案
    type: cards
    title: まとめ
    script: |-
      まとめです。分かったことは、軽量モデルは敵対的訓練で学習不足になること、過学習を抑える手法は逆効果で当てはまりを助けると効くこと、hard-swish が1.91ポイント上がること、ConvStem の失敗の原因は β2 だったことです。
      まだ分からないことは、SiLU が MobileNetV4-M で逆向きになる理由、勾配だけ滑らかにする案が逆効果になる理由、DeiT の seed の揺れの原因です。
      今後考えるべき点として、提案手法の形、学習率を下げたときの急な上昇を利用できないか、判定の基準をモデルごとに変えるかを挙げています。
    point: 学習不足が共通の原因。軽量のまま当てはまりを助ける方向で手法を組み立てる
    cols: 3
    cards:
      - head: わかったこと
        body:
          - "軽量モデルは\n敵対的訓練で学習不足"
          - "hard-swish は +1.91pt\n（スマホでも速い代わり）"
          - "過学習を抑える手法は逆効果\n当てはまりを助けると効く"
          - "ConvStem の崩れは\nβ2 が原因"
      - head: まだわからないこと
        body:
          - "SiLU が M で\n逆向きになる理由"
          - "勾配だけ滑らかにする案が\n逆効果になる理由"
          - "DeiT の seed の揺れ\n（1.37pt）の原因"
      - head: 考えるべき点
        body:
          - "提案手法の形\n（何を学習中だけ足すか）"
          - "学習率を下げたときの\n急な上昇を利用できないか"
          - "判定の基準（0.5 / 1.5pt）を\nモデルごとに変えるか"
    notes: 冒頭の3つの要点をここで回収する。

  # ================================================================== 6. 計画
  - section: 6. 計画
    type: plan
    title: 今後の計画
    script: |-
      今後の計画です。次回までに、hard-swish を MobileNetV4-M で試し、構造の再パラメータ化を実装して実験します。並行して、蒸留が効くかどうかの検証を、3つの生徒モデルと3つの教師モデルの組み合わせで行います。β2を0.95にした ConvStem の再試行も進めます。10月28日以降は、結果を見て決めます。
      修士論文までの見通しとしては、11月に提案手法を決めて本実験を行い、12月に効いた要素を組み合わせて AutoAttack で評価し、1月に執筆に入る予定です。以上です。
