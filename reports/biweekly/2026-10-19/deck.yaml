  side_w: 5.0
  side:
  - '**ReLU**(x) = max(0, x)

    0 で勾配が 0 → 1 に急に変わる

    計算は 0 との比較だけ → 速い'
  - '**SiLU**(x) = x·σ(x)

    σ はシグモイド関数 1/(1+e⁻ˣ)

    指数関数と割り算が要る → 重い'
  - '**GELU**(x) = x·Φ(x)

    Φ は標準正規分布の累積分布関数

    誤差関数 erf が要る → 重い

    ConvNeXt や ViT の標準'
  - '**hard-swish**(x) = x·ReLU6(x+3)/6

    SiLU を折れ線で近似 [@mobilenetv3]

    比較と掛け算だけ → 速い'
  notes: '横軸が入力、縦軸が出力。数式は PowerPoint の数式エディタで清書する。

    速さの理由：TFLite では ReLU・ReLU6 は畳み込みの命令にそのまま付けられる（fused activation）。hard-swish は別の演算だが、NPU が専用に対応しており、実測でも ReLU とほぼ同じ（+0.4%）。シグモイド関数や erf は表引きや多項式近似で計算するので遅い（SiLU は実測 +17%）。

    GELU は Φ（誤差関数 erf）を使い、シグモイド関数は使わない。ただしよく使う近似は x·σ(1.702x)（＝SiLU とほぼ同じ形）や tanh 近似で、どれも指数関数が要る。GELU は実機では未測定。'
- section: 2. 先行研究
  type: table
  title: Smooth Adversarial Training [@sat]
  script: 'Smooth Adversarial Training という研究では、ImageNet の ResNet-50 で、活性化関数を ReLU から SiLU に替えるだけで、頑健性が33.0%から42.3%に上がりました。これは、3倍深い ResNet-152 を ReLU のまま使った39.4%よりも高い値です。

    また、順方向は ReLU のままで、逆方向の勾配だけを滑らかにしても、36.9%まで上がると報告されています。この場合、推論するモデルは普通の ReLU のままです。

    ただし、この研究は ResNet-50 で、1回の攻撃で学習した場合だけです。軽量モデルや、3回の攻撃で学習する場合は確かめられていません。

    また CIFAR-10 の研究では、滑らかな活性化関数は小さい ResNet-18 で効き、大きい WRN-34-10 では効きが小さいと報告されています。論文は理由を示していませんが、小さいモデルは学習不足なので、学習を助ける滑らかさが効きやすいのだと考えています。'
  point: 3倍深いモデルより、活性化関数を滑らかにするほうが効いた
