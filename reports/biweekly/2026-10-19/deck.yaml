  # ------------------------------------------------------------------ 3. 先行研究
  - section: 3. 先行研究
    type: cards
    title: Smooth Adversarial Training [Xie+ 2020]
    point: ReLU を滑らかな活性化関数に替えるだけで、頑健性が大きく上がる
    cite: [sat]
    cols: 2
    cards:
      - head: 何をしたか
        body:
          - "ReLU は 0 で勾配が急に変わる → 攻撃も重みの更新も勾配の質が悪い"
          - "SiLU などの滑らかな関数に替える（計算量はほぼ同じ）"
          - "ImageNet、ResNet-50、PGD-1 で学習、PGD-200 で評価"
      - head: 結果（頑健性 %）
        body:
          - "ReLU の ResNet-50：33.0"
          - "**SiLU の ResNet-50：42.3**"
          - "ReLU の ResNet-152（3倍深い）：39.4"
          - "→ 大きくするより、滑らかにするほうが効く"
    notes: 大きいモデルを使うより、活性化関数を替えるほうが効いた、という報告。

  - section: 3. 先行研究
    type: cards
    title: 私の研究との関係
    point: 順方向は ReLU のまま、勾配だけ滑らかにしても効く
    cite: [sat, bag_of_tricks]
    cols: 2
    cards:
      - head: 使うところ
        body:
          - "順方向は ReLU、逆方向だけ滑らかな勾配：33.0 → **36.9**"
          - "デプロイするモデルは普通の ReLU のまま（スマホの DSP に優しい）"
          - "滑らかさは小さいモデルほど効く（Bag of Tricks）"
      - head: 違うところ・未検証
        body:
          - "SAT は ResNet-50・PGD-1 だけ"
          - "depthwise 畳み込みの軽量モデル、PGD-3 では未検証"
          - "→ 私の SiLU の結果と、提案の方向（plan 0107）の根拠"
    notes: 次のスライドの SiLU の結果と、最後の提案の方向につながる。

  # ------------------------------------------------------------------ 4. 進捗（考察）
  - section: 4. 進捗（考察）
    type: table
    title: SiLU の効果はモデルで逆向き
    point: S では +2.56pt、M では −0.96pt。M は学習率との相性を疑う
    table:
      header: [モデル, 活性化, clean / PGD-10, 最終の学習損失, 学習画像の PGD-10]
      rows:
        - [MobileNetV4-S, ReLU, 53.85 / 30.71, "3.70", "34.40"]
        - [MobileNetV4-S, SiLU, "55.45 / 33.27（**+2.56**）", "3.61", "38.25"]
        - [MobileNetV4-M, ReLU, 63.71 / 39.30, "3.02", "47.50"]
        - [MobileNetV4-M, SiLU, "61.26 / 38.33（==−0.96==）", "3.24", "44.00"]
      col_w: [0.25, 0.1, 0.33, 0.16, 0.16]
      highlight: [[1,2]]
      size: 16
      caption: MobileNetV4-M の ReLU は Phase 1 の seed 1。学習画像＝拡張なしの 2,000 枚
    side_w: 4.0
    side:
      - "M の SiLU は、学習画像への当てはまりも悪い（学習不足が悪化）"
      - "最初の 8 エポックは SiLU が速く、学習率が最大に近づいてから逆転"
      - "学習率は ReLU 向けに調整した 0.025 のまま"
      - "**次**：DSP に優しい代わりの案を先に見る → だめなら M で SiLU の学習率を探す"
    notes: M の比較相手は Phase 1（ReLU）。Phase 2 の基準＋EMA は 10/17 に終わる予定。

  - section: 4. 進捗（考察）
    type: cards
    title: ConvStem が学習しなかった原因
    point: AdamW の β2 が先行研究と違ったため、入力を無視する解に落ちた
    cite: [singh]
    cols: 3
    cards:
      - head: 起きたこと
        body: [ConvNeXt-Atto＋ConvStem が 50 エポック当てずっぽう（0.1%）, 「完了」のまま約 29 GPU 時間を使った]
      - head: 仕組み（CPU で再現）
        body: [stem の出力の約 4 割が入力によらない一定の成分, 敵対的訓練は「どの画像にも同じ答え」に引き込まれる, "β2=0.999 だと抜け出せない"]
      - head: 先行研究との違い
        body: ["Singh らもスクラッチで成功（+0.5pt）", "違いは β2（0.95 vs 0.999）", "→ β2=0.95 で再試行（4本）", "学習していない run を 2 エポックで止める見張りを追加"]
    notes: >-
      DC 成分の割合：ConvStem 0.42、標準 0.003。1要因ずつ変えた CPU 実験で、結果を変えたのは β2 だけ。
      大きいバッチ（Singh は約 1,392）は未検証。

  - section: 4. 進捗（考察）
    type: cards
    title: 提案の方向と、実行中の実験
    point: 学習中だけ容量や滑らかさを足し、デプロイするモデルは変えない
    cite: [sat, mobilenetv3, repvgg, mobileone]
    cols: 3
    cards:
      - head: 仮説
        body: [小さいモデルの形の中に良い解はある, 見つけられないのは最適化の問題, → 学習中だけの工夫で、大きいモデルに迫れるはず]
      - head: 実行中（MobileNetV4-S）
        body: ["hard-swish（DSP 向けの SiLU の近似）", "勾配だけ滑らかに：重みの更新だけ", "勾配だけ滑らかに：攻撃と更新の両方", "結果は 10/17〜18 ごろ"]
      - head: 次の候補
        body: ["構造の再パラメータ化（学習中だけ枝を足し、後で1つにまとめる）", "敵対的訓練では未検証", "同じ GPU 時間の MobileNetV4-M と比べる"]
    notes: >-
      SiLU は sigmoid を含むので、DSP / NPU では遅くなりうる（実機では未測定）。そのため DSP に優しい代わりの案を先に試す。
      途中経過（エポック 15 前後）は基準と SiLU の間。

  - section: 4. 進捗（考察）
    type: cards
    title: まとめ
    point: 学習不足が共通の原因。最適化を助ける方向で手法を組み立てる
    cols: 3
    cards:
      - head: わかったこと
        body: [軽量モデルは敵対的訓練で学習不足, 正則化は逆効果、最適化を助けると効く, "ConvStem の崩れは β2 が原因"]
      - head: まだわからないこと
        body: [SiLU が M で逆向きの理由, DSP に優しい代わりの案は効くか, DeiT の seed の揺れ（1.37pt）の扱い]
      - head: 相談したい点
        body: [判定の基準（0.5 / 1.5pt）をモデルごとに変えるか, 蒸留の生徒を ReLU のままにするか, 構造の再パラメータ化を主軸にしてよいか]
    notes: 冒頭の3つの結論をここで回収する。相談したい点で意見をもらう。

  # ------------------------------------------------------------------ 5. 計画
  - section: 5. 計画
    type: plan
    title: 今後の計画
    point: 蒸留の検証と、提案手法の最初の実験
    micro_head: 次回（11/2）まで
    micro:
      - 代わりの案3本の結果を判定（10/18 ごろ）
      - MobileNetV4-M の基準＋EMA で SiLU を再判定
      - 蒸留の検証（3生徒 × 3教師）を 5 GPU で開始
      - β2=0.95 の ConvStem 4本
      - 構造の再パラメータ化を実装
    macro:
      - {period: 10月, item: Phase 2 の完了・提案の最初の実験, current: true}
      - {period: 11月, item: 蒸留の検証・提案手法の本実験}
      - {period: 12月, item: 効いた要素の組み合わせ・AutoAttack による評価}
      - {period: 1月, item: 修士論文の執筆}
    notes: 数字はすべて学習データから取り分けた画像での内部検証。公式の val と AutoAttack での評価は、組み合わせが決まってから行う。
