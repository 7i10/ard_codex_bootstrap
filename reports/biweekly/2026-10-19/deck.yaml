    ただし計算も2倍 → 計算を

    増やさずに上げる方法を探す'
  notes: 縦軸は毎エポックの PGD-10（検証は 5,000枚のサブセット）。過学習なら、学習画像だけ上がり検証は後半で下がるはずだが、両方とも最後まで上がる。 学習率を下げると、大きな学習率で谷の中を跳ね回っていた重みが谷底に落ちて、急に精度が上がる。この性質をうまく使えないかは今後の検討事項。
