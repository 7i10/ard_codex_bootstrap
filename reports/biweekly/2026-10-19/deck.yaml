    caption: 推論時間：Galaxy S24（Snapdragon 8 Gen 3）の NPU、224px・バッチ1、ランダム初期化のモデル。MobileNetV4-M でも SiLU は +17%、hard-swish は +1%
  side_w: 3.7
  side:
  - '**hard-swish**：

    SiLU の約 75% の効果

    速さは ReLU とほぼ同じ'
  - '**勾配だけ滑らか**は逆効果'
  - |-
    **採用ルール**（MobileNet）
    最良の学習率同士で比べ
    SiLU が 1.0pt 以上
    上回るときだけ SiLU
    それ以外は hard-swish
  script: |-
    ここからは、この夏で最も大きな発見だった活性化関数について詳しく説明します。
    MobileNetV4-S で、ReLU、SiLU、hard-swish、そして順方向は ReLU のまま勾配だけを滑らかにする方法を比べました。SiLU は2.56ポイント、hard-swish は1.91ポイント上がりました。一方で、勾配だけを滑らかにする方法は、重みの更新だけに使うと1.22ポイント、攻撃と更新の両方に使うと7.19ポイント下がりました。
    右の列は、実際のスマートフォンの NPU で測った推論時間です。hard-swish は ReLU とほぼ同じ速さで、SiLU は約17%遅くなります。そこで MobileNet では、それぞれ最良の学習率で比べて、SiLU が hard-swish を1ポイント以上上回るときだけ SiLU を採用し、それ以外は hard-swish を使うというルールにしました。
  notes: 新しい3本（hard-swish、勾配だけ滑らか2本）は非決定的モード、基準と SiLU は決定的モード。seed は1本。遅延は1回の測定（その中で複数回推論した最小値）。
- section: 5. 活性化関数
  type: cards
  title: なぜ順方向の形が効くのか
  point: 効果は重みではなく、関数の形にある
  cols: 3
  cards:
  - head: 勾配だけ滑らかが効かない理由
    body:
    - |-
      MobileNetV4 は
      ReLU の入力がとても小さい
      （80% が |x|<0.3）
      → SAT の設定では
      近似にならない
    - '攻撃＋更新では

      学習中の攻撃が 8.2pt 弱い

      → 弱い攻撃にしか

      強くならない'
  - head: 形が効く証拠
    body:
    - 'SiLU で学習した重みのまま

      ReLU に差し替えると

      精度は 0.1% に崩れる'
    - '損失の線形性が高い

      （SiLU・hard-swish 0.995

      ReLU 0.977）'
  - head: 意味すること
    body:
    - '攻撃に対する損失の形が

      なめらかになり

      学習が進む'
    - '軽量モデルでは

      デプロイするモデル自体の

      活性化関数を替える

      → DSP でも速い hard-swish'
  script: |-
    では、なぜ順方向の形が効くのかを調べました。
    まず、勾配だけを滑らかにする方法が効かなかった理由です。MobileNetV4 では ReLU への入力がとても小さく、80%が0.3未満でした。そのため先行研究の設定では、滑らかな勾配が ReLU のよい近似になっていませんでした。さらに、攻撃と更新の両方に使った場合は、学習中の攻撃が本来より8.2ポイント弱くなっており、弱い攻撃にしか強くならなかったと考えられます。
    次に、SiLU で学習した重みのまま活性化関数を ReLU に差し替えると、精度は0.1%まで崩れました。また、SiLU や hard-swish では、攻撃の範囲の中で損失がより線形に近くなっていました。つまり効果は重みではなく、関数の形そのものにあります。そのため軽量モデルでは、デプロイするモデルの活性化関数を、DSP でも速い hard-swish に替えるのが現実的だと考えています。
  notes: CPU での調査（学習なし、正式な結果ではない）。線形性＝攻撃の範囲（ε 球）の中での入力勾配のそろい方。SAT の ResNet-50 で「更新だけ」が効いた理由は未解決。
- section: 5. 活性化関数
  type: chart
  title: MobileNetV4-M では SiLU が逆向き
  script: |-
    SiLU は MobileNetV4-S では2.56ポイント上がりましたが、MobileNetV4-M では0.77ポイント下がりました。
    グラフは MobileNetV4-M の学習損失です。最初の8エポックほどは SiLU のほうが損失が低いのですが、学習率が大きくなってから逆転し、最後まで ReLU より高いままでした。学習率は ReLU 向けに調整した値のままなので、SiLU との相性が悪い可能性を疑っています。
    そこで、MobileNetV4-M の hard-swish と、MobileNetV4-S で学習率を0.0125に下げた SiLU と hard-swish を回す予定です。活性化関数ごとに最良の学習率で比べて、採用を決めます。
