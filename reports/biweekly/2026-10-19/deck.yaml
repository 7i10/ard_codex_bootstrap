      series:
        - {name: SiLU, values: [0.52, 2.04, 4.9, 7.76, 10.26, 12.02, 13.66, 15.68, 16.06, 17.54, 18.66, 19.14, 20.12, 21.2, 21.26, 21.78, 21.76, 22.32, 22.3, 22.56, 22.54, 22.38, 23.34, 23.24, 24.02, 29.66, 30.46, 30.78, 30.78, 31.8, 31.16, 31.1, 31.52, 30.78, 30.88, 30.98, 31.32, 31.1, 32.24, 32.44, 32.68, 32.3, 32.84, 32.6, 32.36, 32.98, 32.82, 33.0, 33.0, 32.8]}
