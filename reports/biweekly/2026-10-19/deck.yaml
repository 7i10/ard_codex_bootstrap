    caption: 推論時間：Galaxy S24（Snapdragon 8 Gen 3）の NPU、224px・バッチ1、ランダム初期化のモデル。MobileNetV4-M でも SiLU は +17%、hard-swish は +1%
  side_w: 3.7
  side:
  - '**SiLU**

    長所：頑健性が最も高い

    短所：NPU で 17% 遅い'
  - '**hard-swish**

    長所：ReLU とほぼ同じ速さ

    短所：効果は SiLU の約 75%'
  - '**勾配だけ滑らか**は逆効果

    （理由は次のページ）'
  - 'どちらが良いかは用途次第

    → 両方を最良の学習率で並べる'
  script: 'ここからは、この夏で最も大きな発見だった活性化関数について詳しく説明します。

    MobileNetV4-S で、ReLU、SiLU、hard-swish、そして順方向は ReLU のまま勾配だけを滑らかにする方法を比べました。SiLU は2.56ポイント、hard-swish は1.91ポイント上がりました。一方で、勾配だけを滑らかにする方法は、重みの更新だけに使うと1.22ポイント、攻撃と更新の両方に使うと7.19ポイント下がりました。

    右の列は、実際のスマートフォンの NPU で測った推論時間です。hard-swish は ReLU とほぼ同じ速さで、SiLU は約17%遅くなります。SiLU は頑健性が最も高いが遅い、hard-swish は SiLU の約75%の効果で速い、という長所と短所があります。どちらが良いかは使う場面によるので、両方をそれぞれ最良の学習率で学習して、頑健性と速さを並べて示す予定です。'
  notes: '新しい3本（hard-swish、勾配だけ滑らか2本）は非決定的モード、基準と SiLU は決定的モード。seed は1本。遅延は1回の測定（その中で複数回推論した最小値）。

    GPU（RTX 4090）での推論時間は、GPU が空いたら測る（今は学習で埋まっている）。

    内部の取り決め：MobileNet で1つ選ぶ必要があるときは、最良の学習率同士で SiLU が 1.0pt 以上上回れば SiLU、それ以外は hard-swish。'
- section: 5. 活性化関数
  type: figure
  title: 勾配だけ滑らかが効かなかった理由
  point: ReLU の入力が小さく、滑らかな勾配が本当の勾配から大きくずれた
  image: fig_surrogate.png
  caption: 勾配だけ滑らか：順方向は ReLU のまま、逆方向の勾配だけ σ(βx) に替える。β=10 は SAT [@sat] の設定
  side_w: 5.0
  side:
  - '**ずれの原因**：入力の 80% が |x|<0.3

    この範囲では赤と黒が大きく違う

    （ResNet でいえば β≈2 相当）'
  - '**攻撃＋更新（−7.19）**

    ずれた勾配で作る攻撃は弱い

    （正答率 38.1% 対 本当の勾配 29.9%）

    → 弱い攻撃で学習し、clean は上がるが

    本当の攻撃には弱くなる'
  - '**更新だけ（−1.22）**

    勾配の向きは合う（cos 0.94〜0.97）

    が、前半の層の更新が 0.55〜0.67 倍に

    縮む＝学習率を下げたのと同じ'
  - '**β を上げると**ずれは消えるが

    ほぼ ReLU に戻る → 効果も出ない見込み'
  script: '勾配だけを滑らかにする方法が、なぜ効かなかったかを調べました。

    図の黒線が ReLU の本当の勾配で、0か1です。赤線が先行研究の設定で使う滑らかな勾配です。MobileNetV4 では、ReLU への入力の80%が、青い範囲、つまり絶対値0.3未満に入っていました。敵対的訓練した ResNet-18 では49%です。この範囲では赤線と黒線が大きく違うので、MobileNetV4 では滑らかな勾配が本当の勾配の近似になっていません。同じ β=10 でも、ResNet でいえばずっと滑らかな β=2 くらいを使っているのと同じです。

    攻撃と更新の両方に使った場合は、ずれた勾配で学習中の攻撃を作るので、攻撃が弱くなります。実際、滑らかな勾配の攻撃では正答率が38.1%残り、本当の勾配の攻撃の29.9%より8.2ポイント弱い攻撃でした。弱い攻撃で学習したので、clean は上がりましたが、本当の攻撃に対する頑健性は下がりました。

    更新だけに使った場合は、勾配の向きはほぼ合っていましたが、前半の層の更新が0.55から0.67倍に縮んでいて、学習率を下げたのと同じ効果になっていました。

    β を大きくすればずれは消えますが、それはほぼ ReLU に戻すことなので、効果も出ないと見込んで、ここで閉じました。'
  notes: '数値は CPU での調査（学習なし、正式な結果ではない）、1,000枚。入力の標準偏差は MobileNetV4 0.1〜0.2、ResNet-18 0.7〜1.8。β=50 では攻撃の弱さは消える（29.7%）。

    ReLU の入力が小さい理由：ReLU の直前は BatchNorm なので、入力の広がりはほぼ BN の倍率 γ で決まる＝γ が小さく学習されている。γ が小さくなる理由は未調査（重み減衰、敵対的訓練が層の出力を小さくする傾向などが候補）。軽量だからとは限らない。

    SAT の ResNet-50 で「更新だけ」が効いた理由は未解決（ResNet-18 ではずれがさらに小さく、ずれの大きさだけでは説明できない）。'
- section: 5. 活性化関数
  type: cards
  title: 効くのは順方向の関数の形
  point: 重みではなく関数そのものが効いている。だからデプロイする活性化関数を選ぶ
  cols: 3
  cards:
  - head: 差し替えの確認
    body:
    - 'SiLU・hard-swish で

      学習した重みのまま

      ReLU に替えると

      clean も PGD-10 も

      0.1% に崩れる'
    - '→ 学習した重みは

      滑らかな関数と

      セットで働く'
  - head: 損失の形がなめらか
    body:
    - '攻撃の範囲（ε）の中で

      損失がどれだけ

      平面に近いかを測った'
    - 'SiLU・hard-swish は

      ReLU より線形近似の

      誤差が約 25% 小さい'
    - '平面に近いと、勾配で

      作る攻撃が最悪の場合を

      よく近似できる [@llr]'
  - head: 意味すること
    body:
    - '勾配だけの工夫では

      足りず、関数の形を

      替える必要がある'
    - 'デプロイするモデルの

      活性化関数を選ぶ問題

      → SiLU（強い）か

      hard-swish（速い）か'
  script: 'では、SiLU や hard-swish は何が効いているのか。

    まず、SiLU や hard-swish で学習した重みのまま、活性化関数だけを ReLU に差し替えると、clean も PGD-10 も0.1%、つまり当てずっぽうまで崩れました。学習した重みは、滑らかな関数とセットでしか働きません。

    次に、攻撃の範囲の中で、損失がどれだけ平面に近いかを測りました。SiLU と hard-swish は ReLU より、線形近似の誤差が約25%小さくなっていました。損失が平面に近いと、勾配で作る攻撃が最悪の場合をよく近似できるので、敵対的訓練が狙いどおりに働きやすいと考えられます。

    つまり、勾配だけの工夫では足りず、関数の形そのものを替える必要があります。そのため、デプロイするモデルの活性化関数として、強い SiLU と速い hard-swish のどちらを選ぶかという問題になります。'
  notes: 'CPU での調査（学習なし、正式な結果ではない）。

    局所線形性＝ε 球の中のいくつかの点での入力勾配の向きのそろい方（cos の平均、1 で完全に平面）。SiLU・hard-swish 0.995、ReLU 0.977（1 からの差でいえば約 1/4〜1/5）。

    Qin+ 2019 は損失の局所的な線形性を正則化に使い、頑健性が上がることを示した。'
- section: 5. 活性化関数
  type: chart
  title: MobileNetV4-M では SiLU が逆向き
  script: 'SiLU は MobileNetV4-S では2.56ポイント上がりましたが、MobileNetV4-M では0.77ポイント下がりました。

    グラフは MobileNetV4-M の学習損失です。最初の8エポックほどは SiLU のほうが損失が低いのですが、学習率が大きくなってから逆転し、最後まで ReLU より高いままでした。学習率は ReLU 向けに調整した値のままなので、SiLU に合っていない可能性があります。また、先行研究のとおり、大きいモデルほど滑らかさの効きが小さいという可能性もあります。

    そこで、SiLU と hard-swish のどちらも学習率を探して、それぞれ最良の学習率で比べます。そのうえで、頑健性と実機での速さを並べて示します。'
