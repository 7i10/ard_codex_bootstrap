# Plan 0104 (decision 0019, option C as chosen by the human 2026-09-25, design
# "case 1"): fine-tuning-shaped schedule. Identical to Arm A
# (imagenet_mobilenetv4_pgd_at_no_warmup.yaml: clean-pretrained
# MobileNetV4-Conv-Small, 50 epochs, SGD, warmup_multistep 10-epoch warmup,
# x0.1 at [25, 38]) except optimizer.learning_rate 0.05 -> 0.005, protocol.id,
# tracking.group and the observability-only train probe. The LR shape is
# unchanged, so the run is 0 -> 0.005 over 10 epochs, then 0.0005 from epoch 25
# and 0.00005 from epoch 38. Question: in the budget x init 2x2, the lr-0.05
# phase erased the pretrained head start within ~10-25 epochs. Does a peak LR
# 10x lower keep it, and does it reach Arm A sooner or higher? Preregistered
# rule (docs/plans/0104-finetune-lr-schedule.md): last-epoch internal-val
# PGD-10 >= 31.59% (Arm A's higher seed + 1pt) makes this a Phase 1 recipe
# candidate. Secondary: the first epoch reaching Arm A's lower seed (30.58%)
# at or before epoch 25 makes it a half-budget candidate.
