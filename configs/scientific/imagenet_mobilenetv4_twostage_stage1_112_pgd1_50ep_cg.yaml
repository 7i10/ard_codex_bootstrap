# Plan 0103 two-stage follow-up (human 2026-10-01): stage 1 on ORIGINAL images, 50 epochs, to compare with
# imagenet_mobilenetv4_twostage_stage1_112_pgd1_resized_s256_50ep_cg.yaml (pre-resized S=256). Identical to
# imagenet_mobilenetv4_twostage_stage1_112_pgd1.yaml except training.epochs 195 -> 50, milestones [98, 148] -> [25, 38] (same 10-epoch warmup,
# as in the S=256 50-epoch config), step_diagnostics false + cuda_graph true, tracking.group suffix -50ep.
schema_version: 2
protocol: {id: controlled_imagenet_stage02_two_stage_lowres_v1}
tier: production
seeds: {split: 20260911, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: train, download: false, num_classes: 1000, image_size: 224, content_sha256: ae033613f1a67b5982f2e3aeb4bd1095761ac7cf526c066c8fc3671c64795358}
student: {architecture: mobilenetv4_conv_small_imagenet, num_classes: 1000, preprocessing_owner: student_adapter, pretrained: false, normalization: {profile: imagenet_standard}}
method: {id: pgd_at, version: 1, selection_step_size_independent: true, attack: {loss: ce, epsilon: "4/255", step_size: "4/255", steps: 1, random_start: true}, selection_attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true, student_mode: eval, teacher_mode: eval}}
optimizer: {id: sgd, learning_rate: 0.025, momentum: 0.9, weight_decay: 0.0001, nesterov: true}
scheduler: {id: warmup_multistep, milestones: [25, 38], gamma: 0.1, step_at: epoch_end, warmup_epochs: 10}
