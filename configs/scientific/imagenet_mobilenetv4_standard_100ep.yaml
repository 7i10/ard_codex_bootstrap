# Plan 0103 option A (human-approved 2026-09-27): clean-training control,
# 100 epochs. Identical to imagenet_mobilenetv4_pgd_at_random_init_100ep.yaml
# except method (pgd_at -> standard: hard-label CE on the clean training
# batch, training attack removed), protocol.id and tracking.group. Paired with
# imagenet_mobilenetv4_standard_50ep.yaml: does clean training with Arm A's
# recipe keep improving from 50 to 100 epochs where PGD-AT does not? If so,
# PGD-AT's saturation is specific to the robust objective, not the recipe.
# Random init is deliberate: clean-pretrained weights would make a
# clean-training control trivial. selection_attack (PGD-10) and the
# evaluation attack are unchanged, so the clean model's robust accuracy is
# still measured. best.pt is still selected by val PGD-10 accuracy, exactly as
# for pgd_at -- near 0 for a clean model, so compare on last.pt and the
# per-epoch val_clean_accuracy. The schema requires seeds.train_attack, but no
# training attack consumes it.
schema_version: 2
protocol: {id: controlled_imagenet_stage02_clean_budget_v1}
tier: production
seeds: {split: 20260911, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: train, download: false, num_classes: 1000, image_size: 224, content_sha256: ae033613f1a67b5982f2e3aeb4bd1095761ac7cf526c066c8fc3671c64795358}
student: {architecture: mobilenetv4_conv_small_imagenet, num_classes: 1000, preprocessing_owner: student_adapter, pretrained: false, normalization: {profile: imagenet_standard}}
method: {id: standard, version: 1, selection_attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true, student_mode: eval, teacher_mode: eval}}
optimizer: {id: sgd, learning_rate: 0.05, momentum: 0.9, weight_decay: 0.0001, nesterov: true}
scheduler: {id: warmup_multistep, milestones: [50, 76], gamma: 0.1, step_at: epoch_end, warmup_epochs: 10}
training: {epochs: 100, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: true, validation_fraction: 0.02, amp: false, batchnorm_mode: local_per_rank, train_probe_size: 2000}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: imagenet-mobilenetv4-standard-clean-budget, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: val, download: false, num_classes: 1000, image_size: 224, content_sha256: abc0ee800b31bc6c24f02c5d7f41e2a96259f34538be5cfe157b11444a75a642}, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true}, autoattack: false, autoattack_batch_size: 128, autoattack_sample_count: 5000, write_sample_stats: false, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
