# Nesterov-matched plain-AT baseline for the ResNet-18 ADR comparison.
# cifar10_r18_pgd_at.yaml (controlled_cifar10_r18_v1, plain SGD momentum, no
# Nesterov) remains this project's canonical AT baseline for every OTHER
# arm. But cifar10_r18_adr.yaml runs under controlled_cifar10_r18_adr_v1,
# which uses Nesterov momentum (matching the ADR paper's own hyperparameters,
# confirmed against its text and .external/adr). Comparing ADR against the
# plain-SGD baseline would confound ADR's effect with the optimizer
# difference; this arm isolates ADR by running plain PGD-AT under the exact
# same protocol (Nesterov included) so only the method differs.
schema_version: 2
protocol: {id: controlled_cifar10_r18_adr_v1}
tier: production
seeds: {split: 20260722, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: cifar10, root: "${ARD_CIFAR10_ROOT}", split: train, download: false, num_classes: 10}
student: {architecture: saad_resnet18_cifar_v1, num_classes: 10, preprocessing_owner: student_adapter, normalization: {profile: cifar10_raw_identity}}
method: {id: pgd_at, version: 1, attack: {loss: ce, kl_target: null, temperature: 1.0, temperature_squared: true, epsilon: 8/255, step_size: 2/255, steps: 10, random_start: true, trace_step_losses: false}, selection_attack: {loss: ce, epsilon: 8/255, step_size: 2/255, steps: 20, random_start: true, student_mode: eval, teacher_mode: eval, trace_step_losses: false}}
optimizer: {id: sgd, learning_rate: 0.1, momentum: 0.9, weight_decay: 0.0005, nesterov: true}
scheduler: {id: multistep, milestones: [100, 150], gamma: 0.1, step_at: epoch_end}
training: {epochs: 200, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: true, validation_fraction: 0.1, batchnorm_mode: local_per_rank}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: cifar10-r18-pgd-at-nesterov-controlled, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: cifar10, root: "${ARD_CIFAR10_ROOT}", split: test, download: false, num_classes: 10}, attack: {loss: ce, epsilon: 8/255, step_size: 2/255, steps: 20, random_start: true, trace_step_losses: false}, autoattack: false, autoattack_batch_size: 128, write_sample_stats: true, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
