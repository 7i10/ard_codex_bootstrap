# Plan 0102 Workstream A: combine the two techniques tested independently
# so far. TRADES beta=6.0 alone (imagenet_mobilenetv4_trades_beta6.yaml)
# landed close to plain PGD-AT at the 12-epoch horizon (+1.7pp clean/-2.7pp
# PGD-10) -- a point on the tradeoff curve, not a win on both axes. Weight-
# EMA decay=0.999 alone (imagenet_mobilenetv4_pgd_at_no_warmup_weight_ema.yaml)
# won on both axes at high LR but the gap collapsed to noise after the LR
# decay. The literature review's own AWP table (plan 0102 Progress log,
# 2026-09-15) found that TRADES+AWP was the only CIFAR-10 combination that
# improved clean AND robust accuracy together, when neither alone did as
# reliably -- motivating a same-shape test here with the two techniques
# this project has already implemented and reviewed, rather than assuming
# either works better alone. Identical to imagenet_mobilenetv4_trades_beta6.yaml
# except training.weight_ema_decay (0.999, matching this project's own
# first weight-EMA choice) and tracking.group. No engine change (both
# mechanisms already exist and are reviewed); config-only.
