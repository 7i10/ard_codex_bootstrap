# Plan 0102 Workstream A: match Singh/Croce/Hein 2023's own pretrained-init
# ImageNet recipe (arXiv:2303.01870, Appendix A.1/A.2, fetched from the
# paper and its official code -- github.com/nmndeep/revisiting-at -- this
# session, not paraphrased), on MobileNetV4-Conv-Small, to test the
# human's own hypothesis (chat, 2026-09-19/21) that this project's
# clean-accuracy collapse is driven mainly by an over-aggressive,
# from-scratch-style SGD learning rate (peak 0.05, borrowed from the
# classic ImageNet-from-scratch linear-scaling convention) rather than by
# epsilon accumulation, which epsilon-warmup already targeted without
# clearing plain PGD-AT (plan 0102 Progress log, 2026-09-15/18).
#
# Differences from imagenet_mobilenetv4_pgd_at_no_warmup.yaml (this plan's
# own Arm A, the direct baseline this run is compared against): optimizer
# (AdamW, beta1/beta2=0.9/0.95, weight_decay=5e-2, peak LR 1e-3 instead of
# SGD peak 0.05), scheduler (warmup_cosine instead of warmup_multistep --
# same 10-epoch warmup shape, cosine decay to 0 instead of two step
# decays), method.label_smoothing=0.1, dataset.imagenet_heavy_augmentation
# (RandAugment 2 layers/magnitude 9 + RandomErasing p=0.25 on top of the
# existing RandomResizedCrop+flip), training.weight_ema_decay=0.999
# (reusing plan 0102's own already-implemented, already-reviewed
# mechanism -- the paper's own EMA decay matches this value exactly).
# Epsilon, steps, step size, random start and every other attack-identity
# field are UNCHANGED from Arm A -- this is a training-recipe match, not a
# threat-model change (CLAUDE.md rule 6).
#
# Explicitly NOT included yet: CutMix/MixUp. Their own code
# (revisiting-at/main.py) applies Mixup once per batch, before the attack,
# and feeds the resulting soft/mixed label to both the inner PGD/APGD loss
# and the outer training loss (SoftTargetCrossEntropy) -- but this
# project's own CE-loss attack path (LinfPGD._loss, loss="ce") is
# hard-wired to ascend the batch's own hard integer labels, not an
# arbitrary soft target, and pgd_at's own attack.loss is required to be
# "ce" (MethodConfig.resolve_selection_attack). Extending the ce-loss path
# to accept a soft target (a strict superset of its current behavior, not
# a weakening) is real, if small, new surface in src/ard/attacks/ and
# needs its own scientific-reviewer pass before being added -- deferred
# to a follow-up rather than rushed into this config's first launch.
schema_version: 2
protocol: {id: controlled_imagenet_stage01_mobilenetv4_revisiting_at_recipe_v1}
tier: production
seeds: {split: 20260911, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: train, download: false, num_classes: 1000, image_size: 224, content_sha256: ae033613f1a67b5982f2e3aeb4bd1095761ac7cf526c066c8fc3671c64795358, imagenet_heavy_augmentation: true}
student: {architecture: mobilenetv4_conv_small_imagenet, num_classes: 1000, preprocessing_owner: student_adapter, pretrained: true, normalization: {profile: imagenet_standard}}
method: {id: pgd_at, version: 1, label_smoothing: 0.1, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 3, random_start: true}, selection_attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true, student_mode: eval, teacher_mode: eval}}
optimizer: {id: adamw, learning_rate: 0.001, beta1: 0.9, beta2: 0.95, weight_decay: 0.05}
scheduler: {id: warmup_cosine, milestones: [], gamma: 1.0, step_at: epoch_end, warmup_epochs: 10}
training: {epochs: 50, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: true, validation_fraction: 0.02, amp: false, batchnorm_mode: local_per_rank, weight_ema_decay: 0.999}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: imagenet-mobilenetv4-revisiting-at-recipe-controlled, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: val, download: false, num_classes: 1000, image_size: 224, content_sha256: abc0ee800b31bc6c24f02c5d7f41e2a96259f34538be5cfe157b11444a75a642}, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true}, autoattack: false, autoattack_batch_size: 128, autoattack_sample_count: 5000, write_sample_stats: false, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
