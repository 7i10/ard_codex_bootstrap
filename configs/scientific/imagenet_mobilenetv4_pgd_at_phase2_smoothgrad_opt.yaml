# Plan 0103 Phase 2 (human-approved 2026-10-15), MobileNetV4-S (ReLU) random init: ReLU forward unchanged, smooth backward
# (Xie et al. 2020, Smooth Adversarial Training, arXiv:2006.14536 Sec. 3: d/dx (1/alpha) log(1 + exp(alpha x)) = sigmoid(alpha x),
# alpha = beta = 10) only in the backward of the training loss that updates the weights.
# Selection / validation / held-out / ard.cli.evaluate / AutoAttack attacks always see true ReLU gradients; checkpoints are the
# plain ReLU architecture.
# Identical to imagenet_mobilenetv4_pgd_at_phase2_baseline_ema_cg.yaml (baseline + weight EMA 0.9999, selection_subset_size 5000)
# except training.relu_surrogate_gradient {beta: 10.0, scope: optimizer} and tracking.group.
# Also training.deterministic true -> false, training.cudnn_benchmark true and training.cuda_graph removed (nondeterministic fastest
# setting, the human's standing preference). The comparison runs (baseline+EMA, SiLU variant) were deterministic, so this arm
# differs from them in the determinism class too; ard.cli.evaluate records cudnn_benchmark in training_protocol_identity.
schema_version: 2
protocol: {id: controlled_imagenet_stage02_init_lr_grid_v1}
tier: production
seeds: {split: 20260911, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: train, download: false, num_classes: 1000, image_size: 224, content_sha256: ae033613f1a67b5982f2e3aeb4bd1095761ac7cf526c066c8fc3671c64795358}
student: {architecture: mobilenetv4_conv_small_imagenet, num_classes: 1000, preprocessing_owner: student_adapter, pretrained: false, normalization: {profile: imagenet_standard}}
method: {id: pgd_at, version: 1, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 3, random_start: true}, selection_attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true, student_mode: eval, teacher_mode: eval}}
optimizer: {id: sgd, learning_rate: 0.025, momentum: 0.9, weight_decay: 0.0001, nesterov: true}
scheduler: {id: warmup_multistep, milestones: [25, 38], gamma: 0.1, step_at: epoch_end, warmup_epochs: 10}
training: {epochs: 50, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: false, cudnn_benchmark: true, step_diagnostics: false, selection_subset_size: 5000, weight_ema_decay: 0.9999, validation_fraction: 0.02, amp: false, batchnorm_mode: local_per_rank, train_probe_size: 2000, relu_surrogate_gradient: {beta: 10.0, scope: optimizer}}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: imagenet-mobilenetv4-pgd-at-phase2-smoothgrad_opt, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: val, download: false, num_classes: 1000, image_size: 224, content_sha256: abc0ee800b31bc6c24f02c5d7f41e2a96259f34538be5cfe157b11444a75a642}, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true}, autoattack: false, autoattack_batch_size: 128, autoattack_sample_count: 5000, write_sample_stats: false, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
