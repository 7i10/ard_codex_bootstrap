# Plan 0103, two-stage low-resolution PGD-AT, STAGE 1 on a PRE-RESIZED training copy, short side 256
# (loader speedup C, human-approved 2026-09-30). Identical to
# imagenet_mobilenetv4_twostage_stage1_112_pgd1.yaml except `dataset` (root, content_sha256, derived_from)
# and tracking.group (imagenet-mobilenetv4-twostage-lowres-stage1-s256); see that file for the design.
# PREPROCESSING CHANGE (disclosed): the training root is a declared derivative of the original ImageNet
# train set (dataset.derived_from.content_sha256 = the original's pinned digest), built by
# scripts/build_resized_imagenet.py: every image whose shorter side exceeds 256 px was resized to a
# 256 px shorter side (PIL LANCZOS, aspect ratio kept), converted to RGB and re-encoded as baseline JPEG
# quality 95 (4:2:0); smaller images are byte-identical copies. Relative paths are identical, so class
# indices, source IDs and the seeded train/validation split are the original's.
# Blur cost: RandomResizedCrop samples its box on the smaller image (same scale/ratio law), so more crops
# are smaller than 112 px and get UPSAMPLED to 112. Fraction of sampled crops smaller than 112 px:
#   Monte Carlo (reviewer), a 500x375 image, in at least one dim / in both dims:
#     original 0.2% / 0.0%, S=256 12.5% / 6.5%, S=160 49.8% / 34.6%;
#   measured on 2000 random real train images (at least one dim):
#     original 5.9%, S=256 16.0%, S=160 51.5%.
# The in-training validation and train-probe views (ImageNetEvalTransform at 112: short side 128, centre
# crop) also read this derived copy, so per-epoch selection numbers are on derived images; they are
# labelled with validation_dataset_derivation in best.pt / epoch rows / the run summary. The official
# evaluation (evaluation.dataset) is the ORIGINAL val root at 224 px, unchanged. The training root comes
# from ${ARD_IMAGENET_TRAIN_ROOT} (evaluation keeps ${ARD_IMAGENET_ROOT}); load-time checks verify the
# root's manifest digest and its build manifest (derived_manifest.json, pinned by manifest_sha256).
# Stage 2 (original data, 224 px) accepts this run's last.pt as a declared derivative of its own dataset.
schema_version: 2
protocol: {id: controlled_imagenet_stage02_two_stage_lowres_v1}
tier: production
seeds: {split: 20260911, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: imagenet, root: "${ARD_IMAGENET_TRAIN_ROOT}", split: train, download: false, num_classes: 1000, image_size: 224, content_sha256: 65f729c7a34047a9063f95d2ac08e3701a8464203a7074e7216ea11321095ba0, derived_from: {content_sha256: ae033613f1a67b5982f2e3aeb4bd1095761ac7cf526c066c8fc3671c64795358, transform: resize_short_side, short_side: 256, jpeg_quality: 95, resample: lanczos, manifest_sha256: 1b878f7a12c9def7bef00d9ebdd34d4136134c9e8c8772a05afdfce11bd07b0c}}
student: {architecture: mobilenetv4_conv_small_imagenet, num_classes: 1000, preprocessing_owner: student_adapter, pretrained: false, normalization: {profile: imagenet_standard}}
method: {id: pgd_at, version: 1, selection_step_size_independent: true, attack: {loss: ce, epsilon: "4/255", step_size: "4/255", steps: 1, random_start: true}, selection_attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true, student_mode: eval, teacher_mode: eval}}
optimizer: {id: sgd, learning_rate: 0.025, momentum: 0.9, weight_decay: 0.0001, nesterov: true}
scheduler: {id: warmup_multistep, milestones: [98, 148], gamma: 0.1, step_at: epoch_end, warmup_epochs: 10}
training: {epochs: 195, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: true, validation_fraction: 0.02, amp: false, batchnorm_mode: local_per_rank, train_probe_size: 2000, train_image_size: 112}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: imagenet-mobilenetv4-twostage-lowres-stage1-s256, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: val, download: false, num_classes: 1000, image_size: 224, content_sha256: abc0ee800b31bc6c24f02c5d7f41e2a96259f34538be5cfe157b11444a75a642}, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true}, autoattack: false, autoattack_batch_size: 128, autoattack_sample_count: 5000, write_sample_stats: false, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
