# This project's OWN EXTENSION of ADR, not a replication cell: the paper
# (arXiv:2305.12118) covers ResNet-18, PreAct-ResNet-18 and WRN-34-10 only.
# MobileNetV2 tests whether ADR's self-distillation benefit -- which grows as
# capacity shrinks in the paper's own two-point ResNet-18/WRN-34-10 table --
# holds at a smaller capacity than the paper ever measured.  Decision packet
# 0009's preregistered rule reads this arm's AutoAttack gain against the
# cifar10_r18_adr.yaml arm's.
schema_version: 2
protocol: {id: controlled_cifar10_r18_adr_v1}
tier: production
seeds: {split: 20260722, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: cifar10, root: "${ARD_CIFAR10_ROOT}", split: train, download: false, num_classes: 10}
student: {architecture: mobilenet_v2_cifar, num_classes: 10, preprocessing_owner: student_adapter, normalization: {profile: cifar10_standard}}
method: {id: adr, version: 1, adr: {ema_decay: 0.995, temperature_high: 2.5, temperature_low: 2.0, lambda_low: 0.7, lambda_high: 0.95}, attack: {loss: kl, kl_target: rectified, temperature: 1.0, temperature_squared: false, epsilon: 8/255, step_size: 2/255, steps: 10, random_start: true, trace_step_losses: false}, selection_attack: {loss: ce, epsilon: 8/255, step_size: 2/255, steps: 20, random_start: true, student_mode: eval, teacher_mode: eval, trace_step_losses: false}}
optimizer: {id: sgd, learning_rate: 0.1, momentum: 0.9, weight_decay: 0.0005, nesterov: true}
scheduler: {id: multistep, milestones: [100, 150], gamma: 0.1, step_at: epoch_end}
training: {epochs: 200, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: true, validation_fraction: 0.1, batchnorm_mode: local_per_rank}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: cifar10-mobilenetv2-adr-controlled, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: cifar10, root: "${ARD_CIFAR10_ROOT}", split: test, download: false, num_classes: 10}, attack: {loss: ce, epsilon: 8/255, step_size: 2/255, steps: 20, random_start: true, trace_step_losses: false}, autoattack: false, autoattack_batch_size: 128, write_sample_stats: true, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
