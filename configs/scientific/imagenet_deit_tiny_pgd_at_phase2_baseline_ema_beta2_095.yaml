# 2026-10-15 decision 0057 option B (human): DeiT-Tiny no-ConvStem baseline+EMA arm at AdamW beta2 0.95. Base: imagenet_deit_tiny_pgd_at_phase2_baseline_ema.yaml.
# Identical to that base except optimizer.beta2 0.999 -> 0.95 and tracking.group (+ -beta2-095).
# beta2 0.95 is the value Singh et al. (arXiv 2303.01870, App. A.1) used; debugging 0030 found it is the factor that lets ConvStem
# escape the constant-output collapse under PGD-AT from random init (DC offset + LayerNorm attractor) that beta2 0.999 falls into.
# Paired comparison: ConvStem vs no-ConvStem at beta2 0.95. The existing beta2 0.999 baseline+EMA gives the beta2 effect as a by-product.
