# Plan 0103, two-stage low-resolution PGD-AT, STAGE 1 on a PRE-RESIZED training copy (loader speedup C,
# human-approved 2026-09-30). Identical to imagenet_mobilenetv4_twostage_stage1_112_pgd1.yaml except
# `dataset` (root, content_sha256, derived_from) -- see that file for the scientific design.
# PREPROCESSING CHANGE (disclosed): the training root is a declared derivative of the original ImageNet
# train set (dataset.derived_from.content_sha256 = the original's pinned digest), built by
# scripts/build_resized_imagenet.py: every image whose shorter side exceeds 160 px was resized to a
# 160 px shorter side (PIL LANCZOS, aspect ratio kept), converted to RGB and re-encoded as baseline
# JPEG quality 95 (4:2:0); smaller images are byte-identical copies. Relative paths are identical, so
# class indices, source IDs and the seeded train/validation split are the original's. Consequences:
# RandomResizedCrop samples its box on the 160-px image (same scale/ratio law, relative to the smaller
# image), so small crops are upsampled to 112 more often than on the original (quantified in plan 0103);
# the in-training validation and train-probe views (ImageNetEvalTransform at 112: short side 128, centre
# crop) also read the 160-px copy. The official evaluation (evaluation.dataset) is the ORIGINAL val root
# at 224 px, unchanged. The root comes from ${ARD_IMAGENET_TRAIN_ROOT} (evaluation keeps
# ${ARD_IMAGENET_ROOT}); load-time checks verify the root's manifest digest and its build manifest
# (derived_manifest.json, pinned by manifest_sha256). Stage 2 (original data, 224 px) accepts this run's
# last.pt as a declared derivative of its own dataset (ard.engine.checkpoint._same_or_declared_derivative).
