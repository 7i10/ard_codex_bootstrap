# Plan 0103 Phase 2 batch D (human-approved 2026-10-08): ImageNet adversarial-distillation verification.
# RSLAD-advT: RSLAD with the 5/6 adversarial KL targeting softmax(T(x')) (human-approved 2026-10-08), teacher salman2020_resnet50_linf_eps4, target: FKD soft-label bank (top-10 provisional; bank path/digest from the environment until built).
# Student: MobileNetV4-Conv-Small, SGD lr 0.025 (Phase 1 chosen LR); cuda_graph removed (refused with a teacher), otherwise identical to that config.
# Cloned from imagenet_mobilenetv4_pgd_at_random_init_lr0025_cg.yaml: only method/teacher/distillation, tracking.group and the Phase 2
# selection_subset_size (human 2026-10-08) changed; AdamW LR comes from an env var until chosen;
# same data, seeds, optimizer, 50-epoch schedule, selection and evaluation attacks.
schema_version: 2
