# Decision 0017, option B: single-variable ablation of
# imagenet_mobilenetv4_revisiting_at_recipe.yaml (which collapsed --
# plan 0102 Progress log, 2026-09-22, val_pgd_accuracy 0.05% at epoch 49,
# eval-mode robust accuracy confirmed genuinely ~0% by a forward-only check,
# decision 0016). The ONLY difference from that config is
# dataset.imagenet_heavy_augmentation: false. Every other suspected
# ingredient (AdamW at weight_decay 5e-2, the 3-step training attack
# inherited unchanged from Arm A, weight-EMA, label smoothing) is held
# fixed. Attack identity (epsilon, steps, step size, random start,
# normalization) is byte-identical to both the collapsed run and Arm A --
# this is a recipe-ingredient ablation, not a threat-model change
# (CLAUDE.md rule 6). Same protocol id as the collapsed run: this tests the
# same scientific contract (does this recipe collapse), not a new one.
#
# Deliberately still training.epochs: 50, not 25. warmup_cosine's decay
# shape depends on total_epochs; shortening the run to 25 epochs would also
# compress the cosine decay (reaching near-zero LR by epoch 24 instead of
# being mid-decay), confounding "heavy augmentation on/off" with "LR
# schedule shape" -- exactly the kind of single-variable discipline this
# plan's own attribution-scope note (2026-09-21, review P2-7) asks for.
# Launched at the full epoch count per this plan's own established policy
# (2026-09-15): read intermediate epoch-metrics for an early go/no-go read
# against decision 0017's preregistered epoch-25 rule, and kill early if
# collapse recurs; let it run to completion if it looks healthy.
