# Plan 0103 per-family LR tuning on the ImageNet-100 proxy (human-approved
# 2026-09-28, option a: started before the plan 0104 stage-3 proxy verdict).
# Survey config imagenet_deit_tiny_pgd_at.yaml moved to ImageNet-100 (100 classes,
# pinned hashes; pretrained head re-initialised to 100 ways) with the approved
# per-family recipe: AdamW (beta 0.9/0.999), wd 0.05, peak lr 1.25e-4; init pretrained;
# Phase 1 throughput options (non-deterministic, cudnn autotuning,
# step_diagnostics off). Attack, schedule (warmup_multistep, 50 epochs),
# augmentation, batch and probe unchanged.
schema_version: 2
protocol: {id: controlled_imagenet100_proxy_lr_v1}
tier: production
seeds: {split: 20260911, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: imagenet, root: "${ARD_IMAGENET100_ROOT}", split: train, download: false, num_classes: 100, image_size: 224, content_sha256: b7cd65936683eb043f34f151a558d42ad27bdfb2d12750268572f9ded82ca251}
student: {architecture: deit_tiny_imagenet, num_classes: 100, preprocessing_owner: student_adapter, pretrained: true, normalization: {profile: imagenet_standard}}
method: {id: pgd_at, version: 1, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 3, random_start: true}, selection_attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true, student_mode: eval, teacher_mode: eval}}
optimizer: {id: adamw, learning_rate: 1.25e-4, beta1: 0.9, beta2: 0.999, weight_decay: 0.05}
scheduler: {id: warmup_multistep, milestones: [25, 38], gamma: 0.1, step_at: epoch_end, warmup_epochs: 10}
training: {epochs: 50, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: false, cudnn_benchmark: true, step_diagnostics: false, validation_fraction: 0.02, amp: false, batchnorm_mode: local_per_rank, train_probe_size: 2000}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: imagenet100-deit-tiny-adamw-lr-tune, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: imagenet, root: "${ARD_IMAGENET100_ROOT}", split: val, download: false, num_classes: 100, image_size: 224, content_sha256: 8921c1d5d168ef77a4714c2230a5dd8c2cb47609e87dc74f6492691a13961167}, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true}, autoattack: false, autoattack_batch_size: 128, autoattack_sample_count: 5000, write_sample_stats: false, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
