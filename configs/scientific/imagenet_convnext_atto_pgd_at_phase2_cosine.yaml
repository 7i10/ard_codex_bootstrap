# Plan 0103 Phase 2 (human-approved 2026-10-08), ConvNeXt-Atto: scheduler warmup_multistep [25,38] -> warmup_cosine (10-epoch warmup, cosine to 0).
# Identical to imagenet_convnext_atto_pgd_at_phase1_adamw_random_lr5em4.yaml except the Phase 2 template: training.selection_subset_size 5000, training.weight_ema_decay 0.9999 (EMA kept in every Phase 2 run and evaluated alongside the raw weights). the change named above, and tracking.group. AdamW LR from ARD_PHASE2_ADAMW_LR_CONVNEXT_ATTO (the AdamW LR grid is still finishing; set it to the chosen LR before launch; unset fails closed).
# No training.cuda_graph: this clone keeps the Phase 1 throughput options (cudnn_benchmark / compile), which the schema refuses together with cuda_graph; it also changes nothing else of the Phase 1 training block.
schema_version: 2
