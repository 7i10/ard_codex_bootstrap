# Plan 0103 Phase 0: training-budget x initialization 2x2. This cell is
# "pretrained init, 100 epochs". Identical to Arm A
# (imagenet_mobilenetv4_pgd_at_no_warmup.yaml, pretrained, 50 epochs) except
# training.epochs 50 -> 100 and the LR step-decay milestones scaled in
# proportion, [25, 38] -> [50, 76]. The 10-epoch LR warmup is kept in absolute
# epochs (it stabilizes the start of fine-tuning, not a fraction of the run).
# The full attack identity, optimizer and init are byte-identical to Arm A.
# Separate protocol id because the schedule (a protected field, CLAUDE.md
# rule 6) differs. Question: does 50 epochs under-train (budget-limited
# underfitting)? Paired with a random-init 100-epoch cell to ask whether the
# pretrained advantage is a head start or lasting.
schema_version: 2
protocol: {id: controlled_imagenet_stage02_budget_init_v1}
tier: production
seeds: {split: 20260911, model_init: "${ARD_SEED}", data_order: "${ARD_SEED}", augmentation: "${ARD_SEED}", train_attack: "${ARD_SEED}", evaluation_attack: 0, qualitative_panel: "${ARD_SEED}"}
dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: train, download: false, num_classes: 1000, image_size: 224, content_sha256: ae033613f1a67b5982f2e3aeb4bd1095761ac7cf526c066c8fc3671c64795358}
student: {architecture: mobilenetv4_conv_small_imagenet, num_classes: 1000, preprocessing_owner: student_adapter, pretrained: true, normalization: {profile: imagenet_standard}}
method: {id: pgd_at, version: 1, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 3, random_start: true}, selection_attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true, student_mode: eval, teacher_mode: eval}}
optimizer: {id: sgd, learning_rate: 0.05, momentum: 0.9, weight_decay: 0.0001, nesterov: true}
scheduler: {id: warmup_multistep, milestones: [50, 76], gamma: 0.1, step_at: epoch_end, warmup_epochs: 10}
training: {epochs: 100, per_rank_batch_size: 128, global_batch_size: 128, num_workers: "${ARD_NUM_WORKERS}", device: cuda, deterministic: true, validation_fraction: 0.02, amp: false, batchnorm_mode: local_per_rank}
tracking: {mode: online, entity: "${WANDB_ENTITY}", project: "${WANDB_PROJECT}", group: imagenet-mobilenetv4-pgd-at-budget-init, run_id: "${ARD_RUN_ID}", name: null, diagnostics_mode: panel, panel_size: 24, panel_interval_epochs: 5, artifact_interval_epochs: 5}
evaluation: {checkpoints: both, seed: 0, dataset: {name: imagenet, root: "${ARD_IMAGENET_ROOT}", split: val, download: false, num_classes: 1000, image_size: 224, content_sha256: abc0ee800b31bc6c24f02c5d7f41e2a96259f34538be5cfe157b11444a75a642}, attack: {loss: ce, epsilon: "4/255", step_size: "8/765", steps: 10, random_start: true}, autoattack: false, autoattack_batch_size: 128, autoattack_sample_count: 5000, write_sample_stats: false, panel_size: 24}
output_dir: "${ARD_JOB_OUTPUT_DIR}"
