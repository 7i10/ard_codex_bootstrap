# ARD execution environment — the complete specification.
#
# WHY THIS FILE EXISTS
# `requirements/constraints.txt` pins packages but not the Python interpreter,
# and nothing verified that a host matched it.  On 2026-09-06 that gap surfaced:
# Hamster was running Python 3.11.15 and Ferret 3.12.13, with the same torch.
# Two hosts had silently become two different measurement instruments.  Given
# that a control differing only in its random seed already moves the held-out
# endpoint by 1.14-1.25 pp before the learning-rate decay, an unquantified
# interpreter difference is not something this project can carry.
#
# RULE
# Every host that runs or analyses an experiment installs exactly this.  A
# comparison never straddles two environments.  Changing any line here starts a
# new environment generation and invalidates cross-generation pooling.
#
# CORRECTION (2026-09-06, same day)
# The first version of this file listed only what `pip list` made obvious and
# omitted the teacher-loading dependency set.  A real training launch on Ferret
# failed at `import timm`, raised through `.external/robustbench/data.py`.  The
# lesson is recorded rather than quietly fixed: a lock file is unverified until
# a full training run has started under an environment built from it alone.
# Building ard-v2 on a host and then launching one real job is the acceptance
# test for this file.
#
# ACCEPTANCE (2026-09-06, Hamster): PASSED.
# `ard-v2` was built from this file alone.  All 21 pinned packages and the
# interpreter matched `pip freeze` exactly.  Note that `setuptools` is installed
# by conda and does not appear in `pip freeze`, so it must be checked with
# `pip list` or an import rather than reported as missing.  A real CIFAR-10 RSLAD
# training job then started under the environment: the config validated,
# `.external/robustbench` imported (the exact `import timm` path that failed on
# Ferret), the Chen teacher loaded and its SHA-256 verified as
# fc398a4890e6856b5dd80856076000ec9e2debdd12d9f78a66171b9ffc383983, and the run
# bundle reached `status: running`.  The job was stopped there by design;
# starting is the criterion.  Evidence:
# <runtime>/runs/ard-v2-acceptance-v1/run-bundle/manifest.json
#
# ACCEPTANCE (2026-09-06, Ferret): PASSED.
# Ferret's `ard-v2` already existed but predated the correction above: seven of
# the pinned packages were missing outright and `pillow` was one patch ahead.
# It was reconciled and now matches Hamster exactly.  A real CIFAR-10 RSLAD
# training job then ran under it from a pinned worktree at 7bcf211 and completed
# whole epochs rather than merely starting: `train_teacher_adversarial_forward_-
# calls` reached 352 per epoch, which is the direct proof that the Chen teacher
# loaded through the `import timm` path that previously failed on this host.
# Evidence: <runtime>/runs/ard-v2-acceptance-ferret-v1/
#   epoch 0  val_clean 0.3418  val_pgd 0.2324  (336 img/s)
#   epoch 1  val_clean 0.4326  val_pgd 0.2730  (361 img/s)
# Both hosts now report python 3.11.15, torch 2.11.0+cu128, cuda 12.8.
#
# KNOWN GAP: this file alone does not determine an environment.
# It pins the 21 packages the project imports directly, but not the transitive
# set they pull in -- `timm` alone brings `huggingface_hub`, `safetensors`,
# `hf-xet`, `httpx` and its stack.  Installing from this file on a new host lets
# pip choose whatever versions are current that day, which is exactly the drift
# this file exists to prevent.  The full verified closure of 81 packages is
# recorded in `requirements/environment.v2.freeze.txt`; build from this file for
# the interpreter and CUDA wheels, then reconcile against that one and require
# an empty diff.

# GENERATION: v2 (2026-09-06)
# Supersedes the unnamed generation that produced results up to 2026-09-05.
# Those results remain valid on their own terms; they are not pooled with v2.

[interpreter]
python == 3.11.15
# Chosen to match the host that produced every committed result, and the
# `target-version = "py311"` already declared in pyproject.toml.

[cuda]
# Wheels must come from the matching PyTorch index, not PyPI.
index_url = https://download.pytorch.org/whl/cu128
torch == 2.11.0+cu128
torchvision == 0.26.0+cu128

[runtime]
pydantic == 2.13.4
PyYAML == 6.0.3
setuptools == 78.1.0
numpy == 2.4.4          # VERIFY against Hamster on recovery; Ferret observed 2.4.4
pillow == 12.2.0
scipy == 1.17.1
pandas == 3.0.3

[teacher]
# `.external/robustbench` is the pinned checkout that actually loads the
# teacher: src/ard/models/teacher_registry.py inserts it at sys.path[0] before
# importing, so the site-packages `robustbench` distribution is NOT installed
# here.  Its dependencies still are, because the checkout imports them.
timm == 1.0.9
tqdm == 4.68.4
requests == 2.34.2
Jinja2 == 3.1.6
gdown == 5.1.0
geotorch == 0.4.0
torchdiffeq == 0.2.5

[tracking]
wandb == 0.28.0
pyarrow == 25.0.0

[evaluation]
autoattack @ git+https://github.com/fra31/auto-attack.git@a39220048b3c9f2cca9a4d3a54604793c68eca7e

[development]
pytest == 9.1.1
ruff == 0.15.22
mypy == 2.3.0

[environment_name]
# One name on every host.  The legacy `adv` environment is retained read-only on
# each host so that pre-v2 results stay reproducible; it is never updated.
name = ard-v2
